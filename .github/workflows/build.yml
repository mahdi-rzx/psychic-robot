name: Build & Release LunarVeil APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Chunk size (MB)'
        default: '5'
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '5' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Split APK into chunks (chunk_001, chunk_002, …)
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          mkdir -p release_chunks
          CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d -a 3 "$APK_PATH" release_chunks/chunk_
          cd release_chunks
          for f in chunk_*; do
            base64 -w0 "$f" > "$f.b64"
            rm "$f"
          done
          cd ..
          TOTAL_SIZE=$(stat -c%s "$APK_PATH")
          NUM_CHUNKS=$(ls release_chunks/chunk_*.b64 | wc -l)
          echo "{\"version\":\"$VERSION\",\"size\":$TOTAL_SIZE,\"chunks\":$NUM_CHUNKS,\"chunk_size_mb\":$CHUNK_SIZE_MB}" > release_chunks/meta.json

      - name: Store chunks in builds/<version>
        run: |
          mkdir -p builds/$VERSION
          cp -r release_chunks/* builds/$VERSION/

      - name: Commit APK chunks
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds/
          git commit -m "🌙 LunarVeil v$VERSION APK chunks" || echo "No changes"
          git push