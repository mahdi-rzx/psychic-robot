          cat > app/src/main/java/me/lunarveil/navigation/NavGraph.kt << 'EOF'
          package me.lunarveil.navigation

          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material.icons.outlined.*
          import androidx.compose.ui.graphics.vector.ImageVector

          sealed class Screen(
              val route: String,
              val title: String,
              val icon: ImageVector,
              val selectedIcon: ImageVector
          ) {
              object Telegram : Screen("telegram", "Telegram", Icons.Outlined.Chat, Icons.Filled.Chat)
              object Logs : Screen("logs", "Logs", Icons.Outlined.List, Icons.Filled.List)
              object About : Screen("about", "About", Icons.Outlined.Info, Icons.Filled.Info)
          }
          EOF

          cat > app/src/main/java/me/lunarveil/MainActivity.kt << 'EOF'
          package me.lunarveil

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Menu
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.navigation.NavDestination.Companion.hierarchy
          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.compose.*
          import kotlinx.coroutines.launch
          import me.lunarveil.BuildConfig
          import me.lunarveil.data.model.Chat
          import me.lunarveil.navigation.Screen
          import me.lunarveil.ui.screens.*
          import me.lunarveil.ui.theme.LunarVeilTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { LunarVeilTheme { MainApp() } }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainApp() {
              val navController = rememberNavController()
              val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
              val scope = rememberCoroutineScope()
              var chats by remember { mutableStateOf<List<Chat>>(emptyList()) }
              val screens = listOf(Screen.Telegram, Screen.Logs, Screen.About)
              val navBackStackEntry by navController.currentBackStackEntryAsState()
              val currentDestination = navBackStackEntry?.destination

              ModalNavigationDrawer(
                  drawerState = drawerState,
                  drawerContent = {
                      ModalDrawerSheet {
                          Spacer(modifier = Modifier.height(16.dp))
                          Text(
                              text = "LunarVeil",
                              modifier = Modifier.padding(16.dp),
                              style = MaterialTheme.typography.headlineSmall
                          )
                          HorizontalDivider()
                          NavigationDrawerItem(
                              icon = { Text(text = "▶") },
                              label = { Text(text = "Run Workflow") },
                              selected = false,
                              onClick = {
                                  Logger.d(tag = "Main", msg = "Run workflow clicked")
                                  scope.launch { drawerState.close() }
                              }
                          )
                          NavigationDrawerItem(
                              icon = { Text(text = "⬇") },
                              label = { Text(text = "Fetch Results") },
                              selected = false,
                              onClick = {
                                  Logger.d(tag = "Main", msg = "Fetch clicked")
                                  scope.launch { drawerState.close() }
                              }
                          )
                          HorizontalDivider()
                          NavigationDrawerItem(
                              icon = { Text(text = "⚙") },
                              label = { Text(text = "Settings") },
                              selected = false,
                              onClick = {
                                  Logger.d(tag = "Main", msg = "Settings clicked")
                                  scope.launch { drawerState.close() }
                              }
                          )
                      }
                  }
              ) {
                  Scaffold(
                      topBar = {
                          TopAppBar(
                              title = { Text(text = "LunarVeil") },
                              navigationIcon = {
                                  IconButton(onClick = { scope.launch { drawerState.open() } }) {
                                      Icon(imageVector = Icons.Default.Menu, contentDescription = "Menu")
                                  }
                              },
                              colors = TopAppBarDefaults.topAppBarColors(
                                  containerColor = MaterialTheme.colorScheme.surface
                              )
                          )
                      },
                      bottomBar = {
                          NavigationBar {
                              screens.forEach { s ->
                                  val sel = currentDestination?.hierarchy?.any { it.route == s.route } == true
                                  NavigationBarItem(
                                      icon = { Icon(imageVector = if (sel) s.selectedIcon else s.icon, contentDescription = s.title) },
                                      label = { Text(text = s.title) },
                                      selected = sel,
                                      onClick = {
                                          navController.navigate(s.route) {
                                              popUpTo(navController.graph.findStartDestination().id) { saveState = true }
                                              launchSingleTop = true
                                              restoreState = true
                                          }
                                      }
                                  )
                              }
                          }
                      }
                  ) { inner ->
                      NavHost(
                          navController = navController,
                          startDestination = Screen.Telegram.route,
                          modifier = Modifier.padding(inner)
                      ) {
                          composable(Screen.Telegram.route) {
                              TelegramScreen(chats = chats, onChatClick = { Logger.d(tag = "TG", msg = "Chat ${it.id}") })
                          }
                          composable(Screen.Logs.route) {
                              LogsScreen()
                          }
                          composable(Screen.About.route) {
                              AboutScreen(version = BuildConfig.VERSION_NAME)
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Split APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          APK_NAME="LunarVeil_v$VERSION.apk"
          BUILD_DIR="builds/$VERSION"
          mkdir -p "$BUILD_DIR"
          cp "$APK_PATH" "$APK_NAME"
          ZIP_NAME="LunarVeil_v$VERSION.zip"
          zip "$ZIP_NAME" "$APK_NAME"
          rm "$APK_NAME"
          CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d --numeric-suffixes=1 -a 3 "$ZIP_NAME" "$BUILD_DIR/$ZIP_NAME."
          rm "$ZIP_NAME"
          TOTAL_SIZE=0
          for f in "$BUILD_DIR/$ZIP_NAME."*; do TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$f"))); done
          NUM_CHUNKS=$(ls "$BUILD_DIR/$ZIP_NAME."* 2>/dev/null | wc -l)
          cat > "$BUILD_DIR/info.json" << INFO
          {
            "version": "$VERSION",
            "zip_name": "$ZIP_NAME",
            "total_size": $TOTAL_SIZE,
            "total_chunks": $NUM_CHUNKS,
            "chunk_size_mb": $CHUNK_SIZE_MB,
            "download_urls": [
          INFO
          for i in $(seq 1 $NUM_CHUNKS); do
            PADDED=$(printf "%03d" $i)
            echo "    \"https://raw.githubusercontent.com/${{ github.repository }}/main/$BUILD_DIR/${ZIP_NAME}.${PADDED}\"," >> "$BUILD_DIR/info.json"
          done
          sed -i '$ s/,$//' "$BUILD_DIR/info.json"
          echo '  ]' >> "$BUILD_DIR/info.json"
          echo '}' >> "$BUILD_DIR/info.json"

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds/
          git commit -m "LunarVeil v$VERSION" || echo "No changes"
          git push