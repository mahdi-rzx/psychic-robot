          OTPEOF

          cat > app/src/main/java/me/lunarveil/ui/screens/TelegramScreen.kt << 'TGEOF'
          package me.lunarveil.ui.screens

          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import me.lunarveil.data.model.Chat

          @Composable
          fun TelegramScreen(chats: List<Chat>, onChatClick: (Chat) -> Unit) {
              if (chats.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("💬", style = MaterialTheme.typography.displayMedium)
                          Spacer(Modifier.height(8.dp))
                          Text("No chats yet", style = MaterialTheme.typography.bodyLarge)
                          Text("Run workflow then fetch", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  }
                  return
              }

              LazyColumn(modifier = Modifier.fillMaxSize()) {
                  items(chats) { chat ->
                      ChatRow(chat = chat, onClick = { onChatClick(chat) })
                  }
              }
          }

          @Composable
          fun ChatRow(chat: Chat, onClick: () -> Unit) {
              Surface(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable(onClick = onClick),
                  color = MaterialTheme.colorScheme.surface
              ) {
                  Row(
                      modifier = Modifier.padding(12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Surface(
                          modifier = Modifier.size(48.dp),
                          shape = MaterialTheme.shapes.extraLarge,
                          color = MaterialTheme.colorScheme.primaryContainer
                      ) {
                          Box(contentAlignment = Alignment.Center) {
                              Text(
                                  chat.name.take(1).uppercase(),
                                  style = MaterialTheme.typography.titleMedium,
                                  color = MaterialTheme.colorScheme.onPrimaryContainer
                              )
                          }
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              chat.name,
                              style = MaterialTheme.typography.bodyLarge,
                              fontWeight = FontWeight.Medium,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          Text(
                              chat.lastMsg,
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      if (chat.unread > 0) {
                          Surface(
                              shape = MaterialTheme.shapes.small,
                              color = MaterialTheme.colorScheme.primary
                          ) {
                              Text(
                                  "${chat.unread}",
                                  modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp),
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onPrimary
                              )
                          }
                      }
                  }
              }
          }
          TGEOF

          cat > app/src/main/java/me/lunarveil/ui/screens/LogsScreen.kt << 'LOGEOF'
          package me.lunarveil.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.launch

          object Logger {
              val logs = mutableStateListOf<String>()

              fun d(tag: String, msg: String) {
                  logs.add("[DEBUG][$tag] $msg")
              }
              fun e(tag: String, msg: String) {
                  logs.add("[ERROR][$tag] $msg")
              }
          }

          @Composable
          fun LogsScreen() {
              val listState = rememberLazyListState()
              val scope = rememberCoroutineScope()

              LaunchedEffect(Logger.logs.size) {
                  if (Logger.logs.isNotEmpty()) {
                      scope.launch { listState.animateScrollToItem(Logger.logs.size - 1) }
                  }
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(modifier = Modifier.fillMaxWidth().padding(8.dp), horizontalArrangement = Arrangement.End) {
                      TextButton(onClick = { Logger.logs.clear() }) { Text("Clear") }
                  }
                  LazyColumn(state = listState, modifier = Modifier.fillMaxSize()) {
                      items(Logger.logs.toList()) { log ->
                          Text(
                              log,
                              style = MaterialTheme.typography.bodySmall,
                              modifier = Modifier.padding(horizontal = 12.dp, vertical = 2.dp)
                          )
                      }
                  }
              }
          }
          LOGEOF

          cat > app/src/main/java/me/lunarveil/ui/screens/AboutScreen.kt << 'ABOUTEOF'
          package me.lunarveil.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          @Composable
          fun AboutScreen(version: String) {
              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(
                      modifier = Modifier.fillMaxSize().padding(32.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text("🌙", style = MaterialTheme.typography.displayLarge)
                      Spacer(Modifier.height(12.dp))
                      Text("LunarVeil", style = MaterialTheme.typography.headlineLarge)
                      Text("v$version", style = MaterialTheme.typography.bodyLarge, color = MaterialTheme.colorScheme.onSurfaceVariant)
                      Spacer(Modifier.height(24.dp))
                      Text("Telegram bridge client", style = MaterialTheme.typography.bodyMedium)
                      Text("Powered by GitHub Actions", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }
          ABOUTEOF

          # ── Navigation ────────────────────────────────────────
          cat > app/src/main/java/me/lunarveil/navigation/NavGraph.kt << 'NAVEOF'
          package me.lunarveil.navigation

          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material.icons.outlined.*
          import androidx.compose.ui.graphics.vector.ImageVector

          sealed class Screen(val route: String, val title: String, val icon: ImageVector, val selectedIcon: ImageVector) {
              object Telegram : Screen("telegram", "Telegram", Icons.Outlined.Chat, Icons.Filled.Chat)
              object Logs : Screen("logs", "Logs", Icons.Outlined.List, Icons.Filled.List)
              object About : Screen("about", "About", Icons.Outlined.Info, Icons.Filled.Info)
          }
          NAVEOF

          # ── MainActivity ──────────────────────────────────────
          cat > app/src/main/java/me/lunarveil/MainActivity.kt << 'MAINEOF'
          package me.lunarveil

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Menu
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.navigation.NavDestination.Companion.hierarchy
          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.currentBackStackEntryAsState
          import androidx.navigation.compose.rememberNavController
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.runBlocking
          import me.lunarveil.data.local.AppPreferences
          import me.lunarveil.data.model.Chat
          import me.lunarveil.navigation.Screen
          import me.lunarveil.ui.screens.*
          import me.lunarveil.ui.theme.LunarVeilTheme
          import java.util.UUID

          class MainActivity : ComponentActivity() {

              private val prefs by lazy { AppPreferences(this) }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val isSetup = runBlocking { prefs.isSetupComplete.first() }
                  val savedOtp = runBlocking { prefs.otp.first() }

                  setContent {
                      LunarVeilTheme {
                          var setupDone by remember { mutableStateOf(isSetup) }
                          var unlocked by remember { mutableStateOf(!isSetup) }
                          var otp by remember { mutableStateOf(savedOtp) }

                          if (!setupDone) {
                              SetupScreen { token, owner, repo ->
                                  runBlocking {
                                      prefs.saveCredentials(token, owner, repo)
                                      val newOtp = UUID.randomUUID().toString().take(8)
                                      prefs.saveOtp(newOtp)
                                      prefs.setSetupComplete()
                                      otp = newOtp
                                  }
                                  setupDone = true
                                  unlocked = true
                              }
                          } else if (!unlocked) {
                              OtpScreen(expectedOtp = otp) { unlocked = true }
                          } else {
                              MainApp()
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainApp() {
              val navController = rememberNavController()
              val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
              var chats by remember { mutableStateOf<List<Chat>>(emptyList()) }

              val screens = listOf(Screen.Telegram, Screen.Logs, Screen.About)
              val navBackStackEntry by navController.currentBackStackEntryAsState()
              val currentDestination = navBackStackEntry?.destination

              ModalNavigationDrawer(
                  drawerState = drawerState,
                  drawerContent = {
                      ModalDrawerSheet {
                          Spacer(Modifier.height(16.dp))
                          Text("LunarVeil", modifier = Modifier.padding(16.dp), style = MaterialTheme.typography.headlineSmall)
                          Divider()
                          NavigationDrawerItem(
                              icon = { Text("▶") },
                              label = { Text("Run Workflow") },
                              selected = false,
                              onClick = {
                                  Logger.d("Main", "Run workflow clicked")
                                  drawerState.close()
                              }
                          )
                          NavigationDrawerItem(
                              icon = { Text("⬇") },
                              label = { Text("Fetch Results") },
                              selected = false,
                              onClick = {
                                  Logger.d("Main", "Fetch clicked")
                                  drawerState.close()
                              }
                          )
                      }
                  }
              ) {
                  Scaffold(
                      topBar = {
                          TopAppBar(
                              title = { Text("LunarVeil") },
                              navigationIcon = {
                                  IconButton(onClick = { /* TODO: open drawer */ }) {
                                      Icon(Icons.Default.Menu, "Menu")
                                  }
                              },
                              colors = TopAppBarDefaults.topAppBarColors(
                                  containerColor = MaterialTheme.colorScheme.surface
                              )
                          )
                      },
                      bottomBar = {
                          NavigationBar {
                              screens.forEach { screen ->
                                  val selected = currentDestination?.hierarchy?.any { it.route == screen.route } == true
                                  NavigationBarItem(
                                      icon = {
                                          Icon(
                                              if (selected) screen.selectedIcon else screen.icon,
                                              contentDescription = screen.title
                                          )
                                      },
                                      label = { Text(screen.title) },
                                      selected = selected,
                                      onClick = {
                                          navController.navigate(screen.route) {
                                              popUpTo(navController.graph.findStartDestination().id) { saveState = true }
                                              launchSingleTop = true
                                              restoreState = true
                                          }
                                      }
                                  )
                              }
                          }
                      }
                  ) { innerPadding ->
                      NavHost(
                          navController = navController,
                          startDestination = Screen.Telegram.route,
                          modifier = Modifier.padding(innerPadding)
                      ) {
                          composable(Screen.Telegram.route) {
                              TelegramScreen(chats = chats, onChatClick = { Logger.d("Telegram", "Open chat ${it.id}") })
                          }
                          composable(Screen.Logs.route) {
                              LogsScreen()
                          }
                          composable(Screen.About.route) {
                              AboutScreen(version = BuildConfig.VERSION_NAME)
                          }
                      }
                  }
              }
          }
          MAINEOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Create split ZIP
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          APK_NAME="LunarVeil_v$VERSION.apk"
          BUILD_DIR="builds/$VERSION"
          mkdir -p "$BUILD_DIR"
          cp "$APK_PATH" "$APK_NAME"
          ZIP_NAME="LunarVeil_v$VERSION.zip"
          zip "$ZIP_NAME" "$APK_NAME"
          rm "$APK_NAME"
          CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d --numeric-suffixes=1 -a 3 "$ZIP_NAME" "$BUILD_DIR/$ZIP_NAME."
          rm "$ZIP_NAME"
          TOTAL_SIZE=0
          for f in "$BUILD_DIR/$ZIP_NAME."*; do TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$f"))); done
          NUM_CHUNKS=$(ls "$BUILD_DIR/$ZIP_NAME."* 2>/dev/null | wc -l)
          cat > "$BUILD_DIR/info.json" << INFO
          {
            "version": "$VERSION",
            "zip_name": "$ZIP_NAME",
            "total_size": $TOTAL_SIZE,
            "total_chunks": $NUM_CHUNKS,
            "chunk_size_mb": $CHUNK_SIZE_MB,
            "download_urls": [
          INFO
          for i in $(seq 1 $NUM_CHUNKS); do
            PADDED=$(printf "%03d" $i)
            echo "    \"https://raw.githubusercontent.com/${{ github.repository }}/main/$BUILD_DIR/${ZIP_NAME}.${PADDED}\"," >> "$BUILD_DIR/info.json"
          done
          sed -i '$ s/,$//' "$BUILD_DIR/info.json"
          echo '  ]' >> "$BUILD_DIR/info.json"
          echo '}' >> "$BUILD_DIR/info.json"

      - name: Commit split ZIP chunks
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds/
          git commit -m "🌙 LunarVeil v$VERSION – full app" || echo "No changes"
          git push