          # ═══════════════════════════════════════════════════════
          # MAIN ACTIVITY (Everything wired)
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/MainActivity.kt << 'EOF'
          package me.lunarveil

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Menu
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.navigation.NavDestination.Companion.hierarchy
          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.compose.*
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.runBlocking
          import me.lunarveil.BuildConfig
          import me.lunarveil.data.local.AppPreferences
          import me.lunarveil.data.model.Chat
          import me.lunarveil.data.model.Message
          import me.lunarveil.data.remote.RetrofitClient
          import me.lunarveil.data.repository.TelegramRepository
          import me.lunarveil.navigation.Screen
          import me.lunarveil.ui.screens.*
          import me.lunarveil.ui.theme.LunarVeilTheme
          import com.google.gson.Gson

          class MainActivity : ComponentActivity() {
              private val prefs by lazy { AppPreferences(this) }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val setupDone = runBlocking { prefs.isSetup.first() }
                  val savedOtp = runBlocking { prefs.otp.first() }
                  setContent {
                      LunarVeilTheme {
                          var showSetup by remember { mutableStateOf(!setupDone) }
                          var showLock by remember { mutableStateOf(setupDone) }
                          var otp by remember { mutableStateOf(savedOtp) }
                          if (showSetup) {
                              SetupScreen { t, o, r, p ->
                                  runBlocking { prefs.saveCredentials(t, o, r); prefs.saveOtp(p); prefs.setSetupDone(); otp = p }
                                  showSetup = false; showLock = false
                                  Logger.i("Setup", "Credentials saved")
                              }
                          } else if (showLock) {
                              OtpScreen(otp) { showLock = false; Logger.i("Lock", "Unlocked") }
                          } else {
                              MainApp(prefs)
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainApp(prefs: AppPreferences) {
              val navController = rememberNavController()
              val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
              val scope = rememberCoroutineScope()
              var chats by remember { mutableStateOf<List<Chat>>(emptyList()) }
              var isLoading by remember { mutableStateOf(false) }
              var messages by remember { mutableStateOf<List<Message>>(emptyList()) }
              var currentChatId by remember { mutableStateOf<Long?>(null) }
              var currentChatName by remember { mutableStateOf("") }
              var repo by remember { mutableStateOf<TelegramRepository?>(null) }

              // Load credentials
              LaunchedEffect(Unit) {
                  val t = prefs.token.first(); val o = prefs.owner.first(); val r = prefs.repo.first()
                  if (t.isNotBlank() && o.isNotBlank() && r.isNotBlank()) {
                      repo = TelegramRepository(RetrofitClient.api, t, o, r)
                      Logger.i("Main", "Repository ready: $o/$r")
                      // Auto-fetch chats on start
                      isLoading = true
                      repo?.getChats()?.fold(
                          onSuccess = { chats = it; Logger.i("Main", "Loaded ${it.size} chats") },
                          onFailure = { Logger.e("Main", "Failed to load chats: ${it.message}") }
                      )
                      isLoading = false
                  }
              }

              val screens = listOf(Screen.Telegram, Screen.Logs, Screen.About)
              val navBackStackEntry by navController.currentBackStackEntryAsState()
              val currentDestination = navBackStackEntry?.destination

              // Custom routes
              val currentRoute = navBackStackEntry?.destination?.route
              val isDetailScreen = currentRoute == "chat_detail" || currentRoute == "settings"

              ModalNavigationDrawer(
                  drawerState = drawerState,
                  gesturesEnabled = !isDetailScreen,
                  drawerContent = {
                      ModalDrawerSheet {
                          Spacer(Modifier.height(16.dp))
                          Text("LunarVeil", modifier = Modifier.padding(16.dp), style = MaterialTheme.typography.headlineSmall)
                          HorizontalDivider()
                          NavigationDrawerItem(
                              icon = { Text("▶") }, label = { Text("Run Workflow") }, selected = false,
                              onClick = {
                                  scope.launch { drawerState.close() }
                                  val actions = listOf(mapOf("type" to "get_chats"))
                                  repo?.triggerWorkflow(Gson().toJson(actions))
                                  Logger.i("Main", "Workflow triggered")
                              }
                          )
                          NavigationDrawerItem(
                              icon = { Text("⬇") }, label = { Text("Fetch Results") }, selected = false,
                              onClick = {
                                  scope.launch {
                                      drawerState.close()
                                      isLoading = true
                                      repo?.getChats()?.fold(
                                          onSuccess = { chats = it; Logger.i("Main", "Fetched ${it.size} chats") },
                                          onFailure = { Logger.e("Main", "Fetch failed: ${it.message}") }
                                      )
                                      isLoading = false
                                  }
                              }
                          )
                          HorizontalDivider()
                          NavigationDrawerItem(
                              icon = { Text("⚙") }, label = { Text("Settings") }, selected = false,
                              onClick = {
                                  scope.launch { drawerState.close() }
                                  navController.navigate("settings")
                              }
                          )
                      }
                  }
              ) {
                  Scaffold(
                      topBar = {
                          if (!isDetailScreen) {
                              TopAppBar(
                                  title = { Text("LunarVeil") },
                                  navigationIcon = { IconButton(onClick = { scope.launch { drawerState.open() } }) { Icon(Icons.Default.Menu, "Menu") } },
                                  colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface)
                              )
                          }
                      },
                      bottomBar = { if (!isDetailScreen) {
                          NavigationBar {
                              screens.forEach { s ->
                                  val sel = currentDestination?.hierarchy?.any { it.route == s.route } == true
                                  NavigationBarItem(
                                      icon = { Icon(if (sel) s.selectedIcon else s.icon, s.title) },
                                      label = { Text(s.title) }, selected = sel,
                                      onClick = { navController.navigate(s.route) { popUpTo(navController.graph.findStartDestination().id) { saveState = true }; launchSingleTop = true; restoreState = true } }
                                  )
                              }
                          }
                      } }
                  ) { inner ->
                      NavHost(navController, Screen.Telegram.route, Modifier.padding(inner)) {
                          composable(Screen.Telegram.route) {
                              TelegramScreen(chats = chats, isLoading = isLoading) { chat ->
                                  currentChatId = chat.id; currentChatName = chat.name
                                  repo?.getMessages(chat.id)?.fold(
                                      onSuccess = { messages = it },
                                      onFailure = { Logger.e("TG", "Failed messages: ${it.message}") }
                                  )
                                  navController.navigate("chat_detail")
                              }
                          }
                          composable("chat_detail") {
                              ChatDetailScreen(
                                  chatName = currentChatName, messages = messages,
                                  onBack = { navController.popBackStack() },
                                  onSend = { text ->
                                      val actions = listOf(
                                          mapOf("type" to "send_message", "chat_id" to currentChatId, "text" to text),
                                          mapOf("type" to "get_messages", "chat_id" to currentChatId, "limit" to 50)
                                      )
                                      repo?.triggerWorkflow(Gson().toJson(actions))
                                      Logger.i("TG", "Message queued: $text")
                                  }
                              )
                          }
                          composable("settings") {
                              val t = runBlocking { prefs.token.first() }
                              val o = runBlocking { prefs.owner.first() }
                              val r = runBlocking { prefs.repo.first() }
                              SettingsScreen(t, o, r) { navController.popBackStack() }
                          }
                          composable(Screen.Logs.route) { LogsScreen() }
                          composable(Screen.About.route) { AboutScreen(BuildConfig.VERSION_NAME) }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Split APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          APK_NAME="LunarVeil_v$VERSION.apk"
          BUILD_DIR="builds/$VERSION"
          mkdir -p "$BUILD_DIR"
          cp "$APK_PATH" "$APK_NAME"
          ZIP_NAME="LunarVeil_v$VERSION.zip"
          zip "$ZIP_NAME" "$APK_NAME"
          rm "$APK_NAME"
          CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d --numeric-suffixes=1 -a 3 "$ZIP_NAME" "$BUILD_DIR/$ZIP_NAME."
          rm "$ZIP_NAME"
          TOTAL_SIZE=0
          for f in "$BUILD_DIR/$ZIP_NAME."*; do TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$f"))); done
          NUM_CHUNKS=$(ls "$BUILD_DIR/$ZIP_NAME."* 2>/dev/null | wc -l)
          cat > "$BUILD_DIR/info.json" << INFO
          {"version":"$VERSION","zip_name":"$ZIP_NAME","total_size":$TOTAL_SIZE,"total_chunks":$NUM_CHUNKS,"chunk_size_mb":$CHUNK_SIZE_MB,"download_urls":[
          INFO
          for i in $(seq 1 $NUM_CHUNKS); do PADDED=$(printf "%03d" $i); echo "    \"https://raw.githubusercontent.com/${{ github.repository }}/main/$BUILD_DIR/${ZIP_NAME}.${PADDED}\"," >> "$BUILD_DIR/info.json"; done
          sed -i '$ s/,$//' "$BUILD_DIR/info.json"
          echo '  ]}' >> "$BUILD_DIR/info.json"

      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add builds/; git commit -m "LunarVeil v$VERSION" || echo "No changes"; git push