name: Build & Release LunarVeil APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Max size per split file (MB)'
        default: '90'
        required: false
      clean_old_builds:
        description: 'Delete all previous builds'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '90' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || (git commit -m "Clean old builds" && git push)
          git pull

      - name: Generate app source
        run: |
          rm -rf app/src/main/java/me/lunarveil
          mkdir -p app/src/main/java/me/lunarveil/ui/theme
          mkdir -p app/src/main/java/me/lunarveil/ui/screens
          mkdir -p app/src/main/java/me/lunarveil/data/local
          mkdir -p app/src/main/java/me/lunarveil/data/remote
          mkdir -p app/src/main/java/me/lunarveil/data/model
          mkdir -p app/src/main/java/me/lunarveil/navigation
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LunarVeil"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("org.jetbrains.kotlin.kapt") version "1.9.22" apply false
          }
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.kapt")
          }

          android {
              namespace = "me.lunarveil"
              compileSdk = 34

              defaultConfig {
                  applicationId = "me.lunarveil"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = System.getenv("VERSION") ?: "1.0.0"
              }

              buildTypes {
                  debug {}
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              kapt("androidx.room:room-compiler:2.6.1")
              implementation("com.squareup.retrofit2:retrofit:2.9.0")
              implementation("com.squareup.retrofit2:converter-gson:2.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.datastore:datastore-preferences:1.0.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          touch app/proguard-rules.pro

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="LunarVeil"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LunarVeil"
                  tools:targetApi="34">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.LunarVeil">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.LunarVeil" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@color/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@color/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/values/ic_launcher_colors.xml << 'EOF'
          <resources>
              <color name="ic_launcher_background">#6750A4</color>
              <color name="ic_launcher_foreground">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/java/me/lunarveil/ui/theme/Theme.kt << 'EOF'
          package me.lunarveil.ui.theme

          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext

          @Composable
          fun LunarVeilTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              dynamicColor: Boolean = true,
              content: @Composable () -> Unit
          ) {
              val colorScheme = when {
                  dynamicColor && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S -> {
                      val c = LocalContext.current
                      if (darkTheme) dynamicDarkColorScheme(c) else dynamicLightColorScheme(c)
                  }
                  darkTheme -> darkColorScheme(
                      primary = Color(0xFFD0BCFF),
                      secondary = Color(0xFFCCC2DC),
                      tertiary = Color(0xFFEFB8C8)
                  )
                  else -> lightColorScheme(
                      primary = Color(0xFF6750A4),
                      secondary = Color(0xFF625B71),
                      tertiary = Color(0xFF7D5260)
                  )
              }
              MaterialTheme(colorScheme = colorScheme, content = content)
          }
          EOF

          cat > app/src/main/java/me/lunarveil/data/model/Models.kt << 'EOF'
          package me.lunarveil.data.model

          data class Chat(
              val id: Long,
              val name: String,
              val type: String,
              val unread: Int,
              val lastMsg: String,
              val lastDate: String?,
              val archived: Boolean,
              val username: String? = null,
              val phone: String? = null,
              val lastMedia: String? = null
          )

          data class Message(
              val id: Long,
              val date: String?,
              val text: String,
              val out: Boolean,
              val sender: String,
              val media: String? = null,
              val file: FileInfo? = null
          )

          data class FileInfo(
              val id: String,
              val size: Long,
              val name: String,
              val mime: String?
          )
          EOF

          cat > app/src/main/java/me/lunarveil/data/remote/GitHubApi.kt << 'EOF'
          package me.lunarveil.data.remote

          import retrofit2.http.*

          interface GitHubApi {
              @POST("repos/{owner}/{repo}/actions/workflows/telegram.yml/dispatches")
              suspend fun triggerWorkflow(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Body body: TriggerBody
              )

              @GET("repos/{owner}/{repo}/contents/telegram_data/chats.json")
              suspend fun getChats(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String
              ): GitHubContent

              @GET("repos/{owner}/{repo}/contents/telegram_data/chat_{chatId}.json")
              suspend fun getMessages(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Path("chatId") chatId: Long
              ): GitHubContent
          }

          data class TriggerBody(val ref: String = "main", val inputs: TriggerInputs)
          data class TriggerInputs(val actions_json: String)
          data class GitHubContent(
              val content: String?,
              val encoding: String?,
              val sha: String?,
              val size: Int?
          )
          EOF

          cat > app/src/main/java/me/lunarveil/data/local/AppPreferences.kt << 'EOF'
          package me.lunarveil.data.local

          import android.content.Context
          import androidx.datastore.core.DataStore
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map

          private val Context.dataStore: DataStore<Preferences> by preferencesDataStore(name = "lunarveil")

          class AppPreferences(private val context: Context) {
              companion object {
                  val KEY_TOKEN = stringPreferencesKey("token")
                  val KEY_OWNER = stringPreferencesKey("owner")
                  val KEY_REPO = stringPreferencesKey("repo")
              }

              val token: Flow<String> = context.dataStore.data.map { it[KEY_TOKEN] ?: "" }
              val owner: Flow<String> = context.dataStore.data.map { it[KEY_OWNER] ?: "" }
              val repo: Flow<String> = context.dataStore.data.map { it[KEY_REPO] ?: "" }

              suspend fun saveCredentials(t: String, o: String, r: String) {
                  context.dataStore.edit {
                      it[KEY_TOKEN] = t
                      it[KEY_OWNER] = o
                      it[KEY_REPO] = r
                  }
              }
          }
          EOF

          cat > app/src/main/java/me/lunarveil/ui/screens/TelegramScreen.kt << 'EOF'
          package me.lunarveil.ui.screens

          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import me.lunarveil.data.model.Chat

          @Composable
          fun TelegramScreen(chats: List<Chat>, onChatClick: (Chat) -> Unit) {
              if (chats.isEmpty()) {
                  Box(
                      modifier = Modifier.fillMaxSize(),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          text = "No chats",
                          color = MaterialTheme.colorScheme.onSurfaceVariant
                      )
                  }
                  return
              }
              LazyColumn(modifier = Modifier.fillMaxSize()) {
                  items(chats) { c -> ChatRow(chat = c, onClick = { onChatClick(c) }) }
              }
          }

          @Composable
          fun ChatRow(chat: Chat, onClick: () -> Unit) {
              Surface(
                  modifier = Modifier.fillMaxWidth().clickable(onClick = onClick),
                  color = MaterialTheme.colorScheme.surface
              ) {
                  Row(
                      modifier = Modifier.padding(12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Surface(
                          modifier = Modifier.size(48.dp),
                          shape = MaterialTheme.shapes.extraLarge,
                          color = MaterialTheme.colorScheme.primaryContainer
                      ) {
                          Box(contentAlignment = Alignment.Center) {
                              Text(
                                  text = chat.name.take(1).uppercase(),
                                  color = MaterialTheme.colorScheme.onPrimaryContainer
                              )
                          }
                      }
                      Spacer(modifier = Modifier.width(12.dp))
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              text = chat.name,
                              style = MaterialTheme.typography.bodyLarge,
                              fontWeight = FontWeight.Medium,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          Text(
                              text = chat.lastMsg,
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      if (chat.unread > 0) {
                          Surface(
                              shape = MaterialTheme.shapes.small,
                              color = MaterialTheme.colorScheme.primary
                          ) {
                              Text(
                                  text = "${chat.unread}",
                                  modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp),
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onPrimary
                              )
                          }
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/me/lunarveil/ui/screens/LogsScreen.kt << 'EOF'
          package me.lunarveil.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.launch

          object Logger {
              val logs = mutableStateListOf<String>()
              fun d(tag: String, msg: String) { logs.add("[DEBUG][$tag] $msg") }
              fun e(tag: String, msg: String) { logs.add("[ERROR][$tag] $msg") }
          }

          @Composable
          fun LogsScreen() {
              val listState = rememberLazyListState()
              val scope = rememberCoroutineScope()

              LaunchedEffect(Logger.logs.size) {
                  if (Logger.logs.isNotEmpty()) scope.launch { listState.animateScrollToItem(Logger.logs.size - 1) }
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier.fillMaxWidth().padding(8.dp),
                      horizontalArrangement = Arrangement.End
                  ) {
                      TextButton(onClick = { Logger.logs.clear() }) {
                          Text(text = "Clear")
                      }
                  }
                  LazyColumn(
                      state = listState,
                      modifier = Modifier.fillMaxSize()
                  ) {
                      items(Logger.logs.toList()) { log ->
                          Text(
                              text = log,
                              style = MaterialTheme.typography.bodySmall,
                              modifier = Modifier.padding(horizontal = 12.dp, vertical = 2.dp)
                          )
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/me/lunarveil/ui/screens/AboutScreen.kt << 'EOF'
