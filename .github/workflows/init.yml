          cat > app/src/main/java/me/lunarveil/ui/screens/TelegramScreen.kt << 'EOF'
          package me.lunarveil.ui.screens

          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import me.lunarveil.data.model.Chat

          @Composable
          fun TelegramScreen(
              chats: List<Chat>,
              isLoading: Boolean,
              onChatClick: (Chat) -> Unit,
              onRefresh: () -> Unit
          ) {
              if (isLoading && chats.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      CircularProgressIndicator()
                  }
                  return
              }

              if (chats.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(text = "💬", style = MaterialTheme.typography.displayMedium)
                          Spacer(modifier = Modifier.height(8.dp))
                          Text(text = "No chats", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          Spacer(modifier = Modifier.height(4.dp))
                          TextButton(onClick = onRefresh) { Text("Tap to refresh") }
                      }
                  }
                  return
              }

              LazyColumn(modifier = Modifier.fillMaxSize()) {
                  items(chats) { c -> ChatRow(chat = c, onClick = { onChatClick(c) }) }
              }
          }

          @Composable
          fun ChatRow(chat: Chat, onClick: () -> Unit) {
              Surface(modifier = Modifier.fillMaxWidth().clickable(onClick = onClick), color = MaterialTheme.colorScheme.surface) {
                  Row(modifier = Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                      Surface(modifier = Modifier.size(48.dp), shape = MaterialTheme.shapes.extraLarge, color = MaterialTheme.colorScheme.primaryContainer) {
                          Box(contentAlignment = Alignment.Center) {
                              Text(text = chat.name.take(1).uppercase(), color = MaterialTheme.colorScheme.onPrimaryContainer)
                          }
                      }
                      Spacer(modifier = Modifier.width(12.dp))
                      Column(modifier = Modifier.weight(1f)) {
                          Text(text = chat.name, style = MaterialTheme.typography.bodyLarge, fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          Text(text = chat.lastMsg, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      }
                      if (chat.unread > 0) {
                          Surface(shape = MaterialTheme.shapes.small, color = MaterialTheme.colorScheme.primary) {
                              Text(text = "${chat.unread}", modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp), style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onPrimary)
                          }
                      }
                  }
              }
          }
          EOF

