          cat > app/src/main/java/me/lunarveil/ui/screens/TelegramScreen.kt << 'EOF'
          package me.lunarveil.ui.screens
          import androidx.compose.foundation.clickable; import androidx.compose.foundation.layout.*; import androidx.compose.foundation.lazy.LazyColumn; import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*; import androidx.compose.runtime.*; import androidx.compose.ui.Alignment; import androidx.compose.ui.Modifier; import androidx.compose.ui.text.font.FontWeight; import androidx.compose.ui.text.style.TextOverflow; import androidx.compose.ui.unit.dp
          import me.lunarveil.data.model.Chat
          @Composable
          fun TelegramScreen(chats: List<Chat>, isLoading: Boolean, onChatClick: (Chat) -> Unit) {
              if (isLoading) { Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }; return }
              if (chats.isEmpty()) { Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("No chats. Pull to refresh or run workflow.", color = MaterialTheme.colorScheme.onSurfaceVariant) }; return }
              val main = chats.filter { !it.archived }; val archived = chats.filter { it.archived }
              LazyColumn(Modifier.fillMaxSize()) {
                  items(main) { c -> ChatRow(c) { onChatClick(c) } }
                  if (archived.isNotEmpty()) {
                      item { Text("📦 Archived", Modifier.padding(12.dp), style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.onSurfaceVariant) }
                      items(archived) { c -> ChatRow(c) { onChatClick(c) } }
                  }
              }
          }
          @Composable
          fun ChatRow(chat: Chat, onClick: () -> Unit) {
              Surface(Modifier.fillMaxWidth().clickable(onClick = onClick), color = MaterialTheme.colorScheme.surface) {
                  Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                      Surface(Modifier.size(48.dp), shape = MaterialTheme.shapes.extraLarge, color = MaterialTheme.colorScheme.primaryContainer) { Box(contentAlignment = Alignment.Center) { Text(chat.name.take(1).uppercase(), color = MaterialTheme.colorScheme.onPrimaryContainer) } }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text(chat.name, style = MaterialTheme.typography.bodyLarge, fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          Text(chat.lastMsg.ifEmpty { if (chat.lastMedia != null) "📎 Media" else "" }, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      }
                      if (chat.unread > 0) {
                          Surface(shape = MaterialTheme.shapes.small, color = MaterialTheme.colorScheme.primary) { Text("${chat.unread}", Modifier.padding(horizontal = 6.dp, vertical = 2.dp), style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onPrimary) }
                      }
                  }
              }
          }
          EOF

