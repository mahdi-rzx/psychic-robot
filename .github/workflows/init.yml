name: Build & Release LunarVeil APK (Full App)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Max size per split file (MB)'
        default: '90'
        required: false
      clean_old_builds:
        description: 'Delete all previous builds'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '90' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds (if enabled)
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || (git commit -m "🧹 Clean old builds" && git push)
          git pull

      - name: Generate full app source
        run: |
          # ── Directory structure ──────────────────────────────
          rm -rf app/src/main/java/me/lunarveil
          mkdir -p app/src/main/java/me/lunarveil/ui/theme
          mkdir -p app/src/main/java/me/lunarveil/ui/screens
          mkdir -p app/src/main/java/me/lunarveil/data/local
          mkdir -p app/src/main/java/me/lunarveil/data/remote
          mkdir -p app/src/main/java/me/lunarveil/data/model
          mkdir -p app/src/main/java/me/lunarveil/navigation
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          # ── Gradle files ─────────────────────────────────────
          cat > settings.gradle.kts << 'SETEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LunarVeil"
          include(":app")
          SETEOF

          cat > build.gradle.kts << 'ROOTEOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("org.jetbrains.kotlin.kapt") version "1.9.22" apply false
          }
          ROOTEOF

          cat > gradle.properties << 'PROPEOF'
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROPEOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'WRAPEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPEOF

          cat > app/build.gradle.kts << 'APPEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.kapt")
          }
          android {
              namespace = "me.lunarveil"
              compileSdk = 34
              defaultConfig {
                  applicationId = "me.lunarveil"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = System.getenv("VERSION") ?: "1.0.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables { useSupportLibrary = true }
              }
              buildTypes {
                  debug { isDebuggable = true }
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              kapt("androidx.room:room-compiler:2.6.1")
              implementation("com.squareup.retrofit2:retrofit:2.9.0")
              implementation("com.squareup.retrofit2:converter-gson:2.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
              implementation("androidx.datastore:datastore-preferences:1.0.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("io.coil-kt:coil-compose:2.5.0")
              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test.ext:junit:1.1.5")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
          }
          APPEOF
          touch app/proguard-rules.pro

          # ── AndroidManifest ───────────────────────────────────
          cat > app/src/main/AndroidManifest.xml << 'MANEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="LunarVeil"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LunarVeil"
                  tools:targetApi="34">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.LunarVeil">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANEOF

          cat > app/src/main/res/values/themes.xml << 'THEMEEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LunarVeil" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          THEMEEOF

          # ── Icons ─────────────────────────────────────────────
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'ICONEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@color/ic_launcher_foreground"/>
          </adaptive-icon>
          ICONEOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'ICONREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@color/ic_launcher_foreground"/>
          </adaptive-icon>
          ICONREOF

          cat > app/src/main/res/values/ic_launcher_colors.xml << 'COLOREOF'
          <resources>
              <color name="ic_launcher_background">#6750A4</color>
              <color name="ic_launcher_foreground">#FFFFFF</color>
          </resources>
          COLOREOF

          # ══════════════════════════════════════════════════════
          # KOTLIN SOURCE FILES
          # ══════════════════════════════════════════════════════

          # ── Theme ─────────────────────────────────────────────
          cat > app/src/main/java/me/lunarveil/ui/theme/Theme.kt << 'THEMEKT'
          package me.lunarveil.ui.theme

          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext

          private val LightColors = lightColorScheme(
              primary = Color(0xFF6750A4),
              onPrimary = Color(0xFFFFFFFF),
              primaryContainer = Color(0xFFEADDFF),
              onPrimaryContainer = Color(0xFF21005D),
              secondary = Color(0xFF625B71),
              onSecondary = Color(0xFFFFFFFF),
              secondaryContainer = Color(0xFFE8DEF8),
              onSecondaryContainer = Color(0xFF1D192B),
              surface = Color(0xFFFFFBFE),
              onSurface = Color(0xFF1C1B1F),
              background = Color(0xFFFFFBFE),
              onBackground = Color(0xFF1C1B1F),
          )

          private val DarkColors = darkColorScheme(
              primary = Color(0xFFD0BCFF),
              onPrimary = Color(0xFF381E72),
              primaryContainer = Color(0xFF4F378B),
              onPrimaryContainer = Color(0xFFEADDFF),
              secondary = Color(0xFFCCC2DC),
              onSecondary = Color(0xFF332D41),
              secondaryContainer = Color(0xFF4A4458),
              onSecondaryContainer = Color(0xFFE8DEF8),
              surface = Color(0xFF1C1B1F),
              onSurface = Color(0xFFE6E1E5),
              background = Color(0xFF1C1B1F),
              onBackground = Color(0xFFE6E1E5),
          )

          @Composable
          fun LunarVeilTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              dynamicColor: Boolean = true,
              content: @Composable () -> Unit
          ) {
              val colorScheme = when {
                  dynamicColor && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S -> {
                      val context = LocalContext.current
                      if (darkTheme) dynamicDarkColorScheme(context) else dynamicLightColorScheme(context)
                  }
                  darkTheme -> DarkColors
                  else -> LightColors
              }
              MaterialTheme(
                  colorScheme = colorScheme,
                  typography = Typography(),
                  content = content
              )
          }
          THEMEKT

          # ── Models ────────────────────────────────────────────
          cat > app/src/main/java/me/lunarveil/data/model/Models.kt << 'MODELEOF'
          package me.lunarveil.data.model

          data class Chat(
              val id: Long,
              val name: String,
              val type: String,
              val unread: Int,
              val lastMsg: String,
              val lastDate: String?,
              val archived: Boolean,
              val username: String? = null,
              val phone: String? = null,
              val lastMedia: String? = null
          )

          data class Message(
              val id: Long,
              val date: String?,
              val text: String,
              val out: Boolean,
              val sender: String,
              val media: String? = null,
              val file: FileInfo? = null
          )

          data class FileInfo(
              val id: String,
              val size: Long,
              val name: String,
              val mime: String?
          )

          data class UserCredentials(
              val githubToken: String,
              val repoOwner: String,
              val repoName: String
          )
          MODELEOF

          # ── DataStore ─────────────────────────────────────────
          cat > app/src/main/java/me/lunarveil/data/local/AppPreferences.kt << 'PREFEOF'
          package me.lunarveil.data.local

          import android.content.Context
          import androidx.datastore.core.DataStore
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map

          private val Context.dataStore: DataStore<Preferences> by preferencesDataStore(name = "lunarveil_prefs")

          class AppPreferences(private val context: Context) {

              companion object {
                  val KEY_TOKEN = stringPreferencesKey("github_token")
                  val KEY_OWNER = stringPreferencesKey("repo_owner")
                  val KEY_REPO = stringPreferencesKey("repo_name")
                  val KEY_OTP = stringPreferencesKey("otp_password")
                  val KEY_IS_SETUP = booleanPreferencesKey("is_setup_complete")
              }

              val token: Flow<String> = context.dataStore.data.map { it[KEY_TOKEN] ?: "" }
              val owner: Flow<String> = context.dataStore.data.map { it[KEY_OWNER] ?: "" }
              val repo: Flow<String> = context.dataStore.data.map { it[KEY_REPO] ?: "" }
              val otp: Flow<String> = context.dataStore.data.map { it[KEY_OTP] ?: "" }
              val isSetupComplete: Flow<Boolean> = context.dataStore.data.map { it[KEY_IS_SETUP] ?: false }

              suspend fun saveCredentials(token: String, owner: String, repo: String) {
                  context.dataStore.edit {
                      it[KEY_TOKEN] = token
                      it[KEY_OWNER] = owner
                      it[KEY_REPO] = repo
                  }
              }

              suspend fun saveOtp(otp: String) {
                  context.dataStore.edit { it[KEY_OTP] = otp }
              }

              suspend fun setSetupComplete() {
                  context.dataStore.edit { it[KEY_IS_SETUP] = true }
              }
          }
          PREFEOF

          # ── GitHub API ────────────────────────────────────────
          cat > app/src/main/java/me/lunarveil/data/remote/GitHubApi.kt << 'APIEOF'
          package me.lunarveil.data.remote

          import retrofit2.http.*

          interface GitHubApi {

              @POST("repos/{owner}/{repo}/actions/workflows/telegram.yml/dispatches")
              suspend fun triggerWorkflow(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Body body: TriggerBody
              )

              @GET("repos/{owner}/{repo}/contents/telegram_data/chats.json")
              suspend fun getChats(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String
              ): GitHubContent

              @GET("repos/{owner}/{repo}/contents/telegram_data/chat_{chatId}.json")
              suspend fun getMessages(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Path("chatId") chatId: Long
              ): GitHubContent
          }

          data class TriggerBody(
              val ref: String = "main",
              val inputs: TriggerInputs
          )

          data class TriggerInputs(
              val actions_json: String
          )

          data class GitHubContent(
              val content: String?,
              val encoding: String?,
              val sha: String?,
              val size: Int?
          )
          APIEOF

          # ── Screens ───────────────────────────────────────────
          cat > app/src/main/java/me/lunarveil/ui/screens/SetupScreen.kt << 'SETUPEOF'
          package me.lunarveil.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp

          @Composable
          fun SetupScreen(onComplete: (String, String, String) -> Unit) {
              var token by remember { mutableStateOf("") }
              var owner by remember { mutableStateOf("") }
              var repo by remember { mutableStateOf("") }

              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(32.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text("Welcome to LunarVeil", style = MaterialTheme.typography.headlineMedium)
                      Spacer(Modifier.height(8.dp))
                      Text("Enter your GitHub credentials", style = MaterialTheme.typography.bodyMedium)

                      Spacer(Modifier.height(24.dp))
                      OutlinedTextField(
                          value = token,
                          onValueChange = { token = it },
                          label = { Text("GitHub Token") },
                          visualTransformation = PasswordVisualTransformation(),
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(Modifier.height(12.dp))
                      OutlinedTextField(
                          value = owner,
                          onValueChange = { owner = it },
                          label = { Text("Repo Owner") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(Modifier.height(12.dp))
                      OutlinedTextField(
                          value = repo,
                          onValueChange = { repo = it },
                          label = { Text("Repo Name") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(Modifier.height(24.dp))
                      Button(
                          onClick = { onComplete(token, owner, repo) },
                          enabled = token.isNotBlank() && owner.isNotBlank() && repo.isNotBlank(),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Continue")
                      }
                  }
              }
          }
          SETUPEOF

          cat > app/src/main/java/me/lunarveil/ui/screens/OtpScreen.kt << 'OTPEOF'
          package me.lunarveil.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp

          @Composable
          fun OtpScreen(expectedOtp: String, onUnlock: () -> Unit) {
              var otp by remember { mutableStateOf("") }
              var error by remember { mutableStateOf(false) }

              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(32.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text("🔒 LunarVeil", style = MaterialTheme.typography.headlineMedium)
                      Spacer(Modifier.height(8.dp))
                      Text("Enter your password", style = MaterialTheme.typography.bodyMedium)

                      Spacer(Modifier.height(24.dp))
                      OutlinedTextField(
                          value = otp,
                          onValueChange = { otp = it; error = false },
                          label = { Text("Password") },
                          visualTransformation = PasswordVisualTransformation(),
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password),
                          singleLine = true,
                          isError = error,
                          modifier = Modifier.fillMaxWidth()
                      )
                      if (error) {
                          Text("Wrong password", color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                      }
                      Spacer(Modifier.height(24.dp))
                      Button(
                          onClick = {
