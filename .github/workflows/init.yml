name: Build & Release LunarVeil APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Max size per split file (MB)'
        default: '90'
        required: false
      clean_old_builds:
        description: 'Delete all previous builds'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '90' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || (git commit -m "Clean old builds" && git push)
          git pull

      - name: Generate complete app source
        run: |
          # Clean ALL old sources
          rm -rf app/src/main/java
          rm -rf app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/me/lunarveil/ui/theme
          mkdir -p app/src/main/java/me/lunarveil/ui/screens
          mkdir -p app/src/main/java/me/lunarveil/ui/components
          mkdir -p app/src/main/java/me/lunarveil/data/local
          mkdir -p app/src/main/java/me/lunarveil/data/remote
          mkdir -p app/src/main/java/me/lunarveil/data/model
          mkdir -p app/src/main/java/me/lunarveil/data/repository
          mkdir -p app/src/main/java/me/lunarveil/navigation
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          # ═══════════════════════════════════════════════════════
          # GRADLE FILES
          # ═══════════════════════════════════════════════════════
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "LunarVeil"; include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("org.jetbrains.kotlin.kapt") version "1.9.22" apply false
          }
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME;distributionPath=wrapper/dists;distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip;zipStoreBase=GRADLE_USER_HOME;zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("org.jetbrains.kotlin.kapt") }
          android {
              namespace = "me.lunarveil"; compileSdk = 34
              defaultConfig { applicationId = "me.lunarveil"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = System.getenv("VERSION") ?: "1.0.0" }
              buildTypes { debug {}; release { isMinifyEnabled = false; proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"); implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00")); implementation("androidx.compose.ui:ui"); implementation("androidx.compose.ui:ui-graphics"); implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3"); implementation("androidx.compose.material:material-icons-extended"); implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.room:room-runtime:2.6.1"); implementation("androidx.room:room-ktx:2.6.1"); kapt("androidx.room:room-compiler:2.6.1")
              implementation("com.squareup.retrofit2:retrofit:2.9.0"); implementation("com.squareup.retrofit2:converter-gson:2.9.0"); implementation("com.squareup.okhttp3:okhttp:4.12.0"); implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
              implementation("androidx.datastore:datastore-preferences:1.0.0"); implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("io.coil-kt:coil-compose:2.5.0"); implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF
          touch app/proguard-rules.pro

          # ═══════════════════════════════════════════════════════
          # ANDROID MANIFEST
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="LunarVeil" android:roundIcon="@mipmap/ic_launcher_round" android:supportsRtl="true" android:theme="@style/Theme.LunarVeil">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.LunarVeil">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.LunarVeil" parent="android:Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@color/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@color/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cat > app/src/main/res/values/ic_launcher_colors.xml << 'EOF'
          <resources><color name="ic_launcher_background">#6750A4</color><color name="ic_launcher_foreground">#FFFFFF</color></resources>
          EOF

          # ═══════════════════════════════════════════════════════
          # THEME
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/ui/theme/Theme.kt << 'EOF'
          package me.lunarveil.ui.theme
          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          @Composable
          fun LunarVeilTheme(darkTheme: Boolean = isSystemInDarkTheme(), dynamicColor: Boolean = true, content: @Composable () -> Unit) {
              val colorScheme = when {
                  dynamicColor && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S -> { val c = LocalContext.current; if (darkTheme) dynamicDarkColorScheme(c) else dynamicLightColorScheme(c) }
                  darkTheme -> darkColorScheme(primary = Color(0xFFD0BCFF), secondary = Color(0xFFCCC2DC), tertiary = Color(0xFFEFB8C8), background = Color(0xFF1C1B1F), surface = Color(0xFF1C1B1F))
                  else -> lightColorScheme(primary = Color(0xFF6750A4), secondary = Color(0xFF625B71), tertiary = Color(0xFF7D5260), background = Color(0xFFFFFBFE), surface = Color(0xFFFFFBFE))
              }
              MaterialTheme(colorScheme = colorScheme, content = content)
          }
          EOF

          # ═══════════════════════════════════════════════════════
          # MODELS
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/data/model/Models.kt << 'EOF'
          package me.lunarveil.data.model
          import com.google.gson.annotations.SerializedName

          data class Chat(
              val id: Long, val name: String, val type: String, val unread: Int,
              @SerializedName("last_msg") val lastMsg: String,
              @SerializedName("last_date") val lastDate: String?,
              val archived: Boolean, val username: String? = null,
              val phone: String? = null,
              @SerializedName("last_media") val lastMedia: String? = null
          )
          data class Message(
              val id: Long, val date: String?, val text: String, val out: Boolean,
              val sender: String, val media: String? = null, val file: FileInfo? = null
          )
          data class FileInfo(val id: String, val size: Long, val name: String, val mime: String?)
          data class LastUpdate(val timestamp: String?, val actions: Int?)
          data class FileRegistry(val name: String?, val size: Long?, val chunks: Int?, val folder: String?)
          data class FileMeta(val name: String?, val size: Long?, val chunks: Int?)
          EOF

          # ═══════════════════════════════════════════════════════
          # DATASTORE (Credentials + OTP)
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/data/local/AppPreferences.kt << 'EOF'
          package io.github.youruser;package me.lunarveil.data.local
          import android.content.Context
          import androidx.datastore.core.DataStore; import androidx.datastore.preferences.core.*; import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow; import kotlinx.coroutines.flow.map
          private val Context.dataStore: DataStore<Preferences> by preferencesDataStore(name = "lunarveil")
          class AppPreferences(private val context: Context) {
              companion object { val KEY_TOKEN = stringPreferencesKey("token"); val KEY_OWNER = stringPreferencesKey("owner"); val KEY_REPO = stringPreferencesKey("repo"); val KEY_OTP = stringPreferencesKey("otp"); val KEY_SETUP = booleanPreferencesKey("setup") }
              val token: Flow<String> = context.dataStore.data.map { it[KEY_TOKEN] ?: "" }
              val owner: Flow<String> = context.dataStore.data.map { it[KEY_OWNER] ?: "" }
              val repo: Flow<String> = context.dataStore.data.map { it[KEY_REPO] ?: "" }
              val otp: Flow<String> = context.dataStore.data.map { it[KEY_OTP] ?: "" }
              val isSetup: Flow<Boolean> = context.dataStore.data.map { it[KEY_SETUP] ?: false }
              suspend fun saveCredentials(t: String, o: String, r: String) { context.dataStore.edit { it[KEY_TOKEN] = t; it[KEY_OWNER] = o; it[KEY_REPO] = r } }
              suspend fun saveOtp(otp: String) { context.dataStore.edit { it[KEY_OTP] = otp } }
              suspend fun setSetupDone() { context.dataStore.edit { it[KEY_SETUP] = true } }
          }
          EOF

          # ═══════════════════════════════════════════════════════
          # GITHUB API SERVICE
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/data/remote/GitHubApi.kt << 'EOF'
          package me.lunarveil.data.remote
          import retrofit2.Response
          import retrofit2.http.*
          interface GitHubApi {
              @POST("repos/{owner}/{repo}/actions/workflows/telegram.yml/dispatches")
              suspend fun triggerWorkflow(@Path("owner") owner: String, @Path("repo") repo: String, @Body body: TriggerBody, @Header("Authorization") auth: String): Response<Unit>
              @GET("repos/{owner}/{repo}/contents/telegram_data/chats.json")
              suspend fun getChats(@Path("owner") owner: String, @Path("repo") repo: String, @Header("Authorization") auth: String): GitHubContent
              @GET("repos/{owner}/{repo}/contents/telegram_data/chat_{chatId}.json")
              suspend fun getMessages(@Path("owner") owner: String, @Path("repo") repo: String, @Path("chatId") chatId: Long, @Header("Authorization") auth: String): GitHubContent
              @GET("repos/{owner}/{repo}/contents/telegram_data/last_update.json")
              suspend fun getLastUpdate(@Path("owner") owner: String, @Path("repo") repo: String, @Header("Authorization") auth: String): GitHubContent
              @GET("repos/{owner}/{repo}/contents/telegram_data/files/registry.json")
              suspend fun getFileRegistry(@Path("owner") owner: String, @Path("repo") repo: String, @Header("Authorization") auth: String): GitHubContent
          }
          data class TriggerBody(val ref: String = "main", val inputs: TriggerInputs)
          data class TriggerInputs(val actions_json: String)
          data class GitHubContent(val content: String?, val encoding: String?, val sha: String?, val size: Int?)
          EOF

          # ═══════════════════════════════════════════════════════
          # RETROFIT CLIENT (Singleton)
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/data/remote/RetrofitClient.kt << 'EOF'
          package mport;package me.lunarveil.data.remote
          import okhttp3.OkHttpClient; import okhttp3.logging.HttpLoggingInterceptor; import retrofit2.Retrofit; import retrofit2.converter.gson.GsonConverterFactory
          import java.util.concurrent.TimeUnit
          object RetrofitClient {
              private val logging = HttpLoggingInterceptor().apply { level = HttpLoggingInterceptor.Level.BODY }
              private val client = OkHttpClient.Builder().addInterceptor(logging).connectTimeout(30, TimeUnit.SECONDS).readTimeout(30, TimeUnit.SECONDS).build()
              private val retrofit = Retrofit.Builder().baseUrl("https://api.github.com/").client(client).addConverterFactory(GsonConverterFactory.create()).build()
              val api: GitHubApi = retrofit.create(GitHubApi::class.java)
          }
          EOF

          # ═══════════════════════════════════════════════════════
          # REPOSITORY (Business Logic)
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/data/repository/TelegramRepository.kt << 'EOF'
          package me.lunarveil.data.repository
          import android.util.Base64
          import com.google.gson.Gson; import com.google.gson.reflect.TypeToken
          import me.lunarveil.data.model.*; import me.lunarveil.data.remote.*
          class TelegramRepository(private val api: GitHubApi, private val token: String, private val owner: String, private val repo: String) {
              private val gson = Gson(); private val auth = "Bearer $token"
              suspend fun triggerWorkflow(actionsJson: String): Result<Unit> = try { val r = api.triggerWorkflow(owner, repo, TriggerBody(inputs = TriggerInputs(actionsJson)), auth); if (r.isSuccessful) Result.success(Unit) else Result.failure(Exception("HTTP ${r.code()}")) } catch (e: Exception) { Result.failure(e) }
              suspend fun getChats(): Result<List<Chat>> = try { val c = api.getChats(owner, repo, auth); val json = decodeContent(c.content); Result.success(gson.fromJson(json, object : TypeToken<List<Chat>>() {}.type) ?: emptyList()) } catch (e: Exception) { Result.failure(e) }
              suspend fun getMessages(chatId: Long): Result<List<Message>> = try { val c = api.getMessages(owner, repo, chatId, auth); val json = decodeContent(c.content); Result.success(gson.fromJson(json, object : TypeToken<List<Message>>() {}.type) ?: emptyList()) } catch (e: Exception) { Result.failure(e) }
              suspend fun getLastUpdate(): Result<LastUpdate> = try { val c = api.getLastUpdate(owner, repo, auth); val json = decodeContent(c.content); Result.success(gson.fromJson(json, LastUpdate::class.java) ?: LastUpdate(null, null)) } catch (e: Exception) { Result.failure(e) }
              private fun decodeContent(content: String?): String {
                  if (content == null) return ""
                  return try { String(Base64.decode(content.replace("\n", "").replace("\r", ""), Base64.DEFAULT)) } catch (e: Exception) { content }
              }
          }
          EOF

          # ═══════════════════════════════════════════════════════
          # NAVIGATION
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/navigation/NavGraph.kt << 'EOF'
          package me.lunarveil.navigation
          import androidx.compose.material.icons.Icons; import androidx.compose.material.icons.filled.*; import androidx.compose.material.icons.outlined.*; import androidx.compose.ui.graphics.vector.ImageVector
          sealed class Screen(val route: String, val title: String, val icon: ImageVector, val selectedIcon: ImageVector) {
              object Telegram : Screen("telegram", "Telegram", Icons.Outlined.Chat, Icons.Filled.Chat)
              object Logs : Screen("logs", "Logs", Icons.Outlined.List, Icons.Filled.List)
              object About : Screen("about", "About", Icons.Outlined.Info, Icons.Filled.Info)
          }
          EOF

          # ═══════════════════════════════════════════════════════
          # LOGGER
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/ui/screens/Logger.kt << 'EOF'
          package me.lunarveil.ui.screens
          import androidx.compose.runtime.mutableStateListOf
          object Logger {
              val logs = mutableStateListOf<String>()
              fun d(tag: String, msg: String) { logs.add("[DEBUG][$tag] $msg") }
              fun e(tag: String, msg: String) { logs.add("[ERROR][$tag] $msg") }
              fun i(tag: String, msg: String) { logs.add("[INFO][$tag] $msg") }
          }
          EOF

          # ═══════════════════════════════════════════════════════
          # SETUP SCREEN
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/ui/screens/SetupScreen.kt << 'EOF'
          package me.lunarveil.ui.screens
          import androidx.compose.foundation.layout.*; import androidx.compose.material3.*; import androidx.compose.runtime.*; import androidx.compose.ui.Alignment; import androidx.compose.ui.Modifier; import androidx.compose.ui.text.input.PasswordVisualTransformation; import androidx.compose.ui.unit.dp
          @Composable
          fun SetupScreen(onComplete: (String, String, String, String) -> Unit) {
              var token by remember { mutableStateOf("") }; var owner by remember { mutableStateOf("") }; var repo by remember { mutableStateOf("") }; var otp by remember { mutableStateOf("") }
              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(Modifier.fillMaxSize().padding(32.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                      Text("🌙 Welcome to LunarVeil", style = MaterialTheme.typography.headlineMedium); Spacer(Modifier.height(24.dp))
                      OutlinedTextField(token, { token = it }, label = { Text("GitHub Token") }, visualTransformation = PasswordVisualTransformation(), singleLine = true, modifier = Modifier.fillMaxWidth())
                      Spacer(Modifier.height(8.dp))
                      OutlinedTextField(owner, { owner = it }, label = { Text("Repo Owner (e.g. mahdi-rzx)") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                      Spacer(Modifier.height(8.dp))
                      OutlinedTextField(repo, { repo = it }, label = { Text("Repo Name (e.g. shiny-memory)") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                      Spacer(Modifier.height(8.dp))
                      OutlinedTextField(otp, { otp = it }, label = { Text("Set App Password") }, visualTransformation = PasswordVisualTransformation(), singleLine = true, modifier = Modifier.fillMaxWidth())
                      Spacer(Modifier.height(24.dp))
                      Button({ onComplete(token, owner, repo, otp) }, enabled = token.isNotBlank() && owner.isNotBlank() && repo.isNotBlank() && otp.isNotBlank(), modifier = Modifier.fillMaxWidth()) { Text("Save & Continue") }
                  }
              }
          }
          EOF

          # ═══════════════════════════════════════════════════════
          # OTP LOCK SCREEN
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/ui/screens/OtpScreen.kt << 'EOF'
          package me.lunarveil.ui.screens
          import androidx.compose.foundation.layout.*; import androidx.compose.foundation.text.KeyboardOptions; import androidx.compose.material3.*; import androidx.compose.runtime.*; import androidx.compose.ui.Alignment; import androidx.compose.ui.Modifier; import androidx.compose.ui.text.input.KeyboardType; import androidx.compose.ui.text.input.PasswordVisualTransformation; import androidx.compose.ui.unit.dp
          @Composable
          fun OtpScreen(expectedOtp: String, onUnlock: () -> Unit) {
              var otp by remember { mutableStateOf("") }; var error by remember { mutableStateOf(false) }
              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(Modifier.fillMaxSize().padding(32.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                      Text("🔒 LunarVeil", style = MaterialTheme.typography.headlineMedium); Spacer(Modifier.height(24.dp))
                      OutlinedTextField(otp, { otp = it; error = false }, label = { Text("Password") }, visualTransformation = PasswordVisualTransformation(), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password), singleLine = true, isError = error, modifier = Modifier.fillMaxWidth())
                      if (error) Text("Wrong password", color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                      Spacer(Modifier.height(24.dp))
                      Button({ if (otp == expectedOtp) onUnlock() else error = true }, Modifier.fillMaxWidth()) { Text("Unlock") }
                  }
              }
          }
          EOF

          # ═══════════════════════════════════════════════════════
          # SETTINGS SCREEN
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/ui/screens/SettingsScreen.kt << 'EOF'
          package me.lunarveil.ui.screens
          import androidx.compose.foundation.layout.*; import androidx.compose.material3.*; import androidx.compose.runtime.*; import androidx.compose.ui.Alignment; import androidx.compose.ui.Modifier; import androidx.compose.ui.unit.dp
          @Composable
          fun SettingsScreen(token: String, owner: String, repo: String, onBack: () -> Unit) {
              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(Modifier.fillMaxSize().padding(16.dp)) {
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          TextButton(onClick = onBack) { Text("← Back") }; Spacer(Modifier.weight(1f)); Text("Settings", style = MaterialTheme.typography.titleLarge)
                      }
                      Spacer(Modifier.height(16.dp))
                      Text("GitHub Configuration", style = MaterialTheme.typography.titleMedium); Spacer(Modifier.height(8.dp))
                      ListItem(headlineContent = { Text("Token") }, supportingContent = { Text(token.take(8) + "..." + token.takeLast(4)) })
                      ListItem(headlineContent = { Text("Repository") }, supportingContent = { Text("$owner/$repo") })
                      HorizontalDivider(); Spacer(Modifier.height(16.dp))
                      Text("App Info", style = MaterialTheme.typography.titleMedium); Spacer(Modifier.height(8.dp))
                      ListItem(headlineContent = { Text("Version") }, supportingContent = { Text(me.lunarveil.BuildConfig.VERSION_NAME) })
                      ListItem(headlineContent = { Text("Package") }, supportingContent = { Text("me.lunarveil") })
                  }
              }
          }
          EOF

          # ═══════════════════════════════════════════════════════
          # CHAT DETAIL SCREEN
          # ═══════════════════════════════════════════════════════
          cat > app/src/main/java/me/lunarveil/ui/screens/ChatDetailScreen.kt << 'EOF'
          package me.lunarveil.ui.screens
          import androidx.compose.foundation.layout.*; import androidx.compose.foundation.lazy.LazyColumn; import androidx.compose.foundation.lazy.items; import androidx.compose.foundation.lazy.rememberLazyListState; import androidx.compose.material3.*; import androidx.compose.runtime.*; import androidx.compose.ui.Alignment; import androidx.compose.ui.Modifier; import androidx.compose.ui.text.style.TextOverflow; import androidx.compose.ui.unit.dp
          import me.lunarveil.data.model.Message
          @Composable
          fun ChatDetailScreen(chatName: String, messages: List<Message>, onBack: () -> Unit, onSend: (String) -> Unit) {
              var input by remember { mutableStateOf("") }
              val listState = rememberLazyListState()
              LaunchedEffect(messages.size) { if (messages.isNotEmpty()) listState.animateScrollToItem(messages.size - 1) }
              Column(Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth().padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                      TextButton(onClick = onBack) { Text("←") }; Text(chatName, style = MaterialTheme.typography.titleMedium, maxLines = 1, overflow = TextOverflow.Ellipsis)
                  }
                  HorizontalDivider()
                  LazyColumn(state = listState, modifier = Modifier.weight(1f).padding(horizontal = 8.dp)) {
                      items(messages) { msg ->
                          val isSent = msg.out
                          Column(modifier = Modifier.fillMaxWidth().padding(vertical = 2.dp), horizontalAlignment = if (isSent) Alignment.End else Alignment.Start) {
                              Surface(shape = MaterialTheme.shapes.medium, color = if (isSent) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant, modifier = Modifier.widthIn(max = 280.dp)) {
                                  Column(Modifier.padding(8.dp)) {
                                      if (!isSent && msg.sender.isNotBlank()) Text(msg.sender, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.primary)
                                      if (msg.text.isNotBlank()) Text(msg.text, style = MaterialTheme.typography.bodyMedium)
                                      if (msg.media != null) Text("📎 ${msg.media}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                              }
                          }
                      }
                  }
                  HorizontalDivider()
                  Row(Modifier.fillMaxWidth().padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                      OutlinedTextField(input, { input = it }, modifier = Modifier.weight(1f), placeholder = { Text("Message...") }, singleLine = true)
                      Spacer(Modifier.width(8.dp))
                      Button({ if (input.isNotBlank()) { onSend(input); input = "" } }) { Text("Send") }
                  }
              }
          }
          EOF

          # ═══════════════════════════════════════════════════════
