name: Build & Release LunarVeil APK (Python)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Max size per split file (MB)'
        default: '90'
        required: false
      clean_old_builds:
        description: 'Delete all previous builds'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '90' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || (git commit -m "Clean old builds" && git push)
          git pull

      - name: Generate Python app source
        run: |
          mkdir -p lunarveil_app

          # ── requirements.txt ──
          cat > lunarveil_app/requirements.txt << 'EOF'
          kivy==2.3.0
          kivymd==2.0.1.dev0
          https://github.com/kivymd/KivyMD/archive/master.zip
          requests==2.31.0
          urllib3==2.1.0
          certifi==2023.11.17
          charset-normalizer==3.3.2
          idna==3.6
          EOF

          # ── main.py (Complete app) ──
          cat > lunarveil_app/main.py << 'EOF'
          import os
          import json
          import base64
          import threading
          import time
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.screenmanager import ScreenManager, Screen
          from kivy.uix.scrollview import ScrollView
          from kivy.uix.label import Label
          from kivy.uix.button import Button
          from kivy.uix.textinput import TextInput
          from kivy.uix.popup import Popup
          from kivy.uix.recycleview import RecycleView
          from kivy.uix.recycleboxlayout import RecycleBoxLayout
          from kivy.properties import StringProperty, ObjectProperty, ListProperty, BooleanProperty, NumericProperty
          from kivy.metrics import dp
          from kivy.clock import Clock
          from kivy.lang import Builder
          from kivy.storage.jsonstore import JsonStore
          from kivymd.app import MDApp
          from kivymd.uix.list import MDList, OneLineListItem, TwoLineListItem, ThreeLineListItem
          from kivymd.uix.card import MDCard
          from kivymd.uix.dialog import MDDialog
          from kivymd.uix.button import MDRaisedButton, MDFlatButton, MDIconButton
          from kivymd.uix.textfield import MDTextField
          from kivymd.uix.toolbar import MDTopAppBar
          from kivymd.uix.navigationbar import MDNavigationBar, MDNavigationItem
          from kivymd.uix.snackbar import MDSnackbar
          from kivymd.uix.menu import MDDropdownMenu
          from kivymd.uix.label import MDLabel
          from kivymd.uix.progressindicator import MDCircularProgressIndicator
          import requests

          # ── GitHub API Service ──
          class GitHubAPI:
              BASE = "https://api.github.com"
              
              def __init__(self, token, owner, repo):
                  self.token = token
                  self.owner = owner
                  self.repo = repo
                  self.headers = {
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "LunarVeil"
                  }
              
              def trigger_workflow(self, actions_json):
                  url = f"{self.BASE}/repos/{self.owner}/{self.repo}/actions/workflows/telegram.yml/dispatches"
                  body = {"ref": "main", "inputs": {"actions_json": actions_json}}
                  r = requests.post(url, json=body, headers=self.headers)
                  return r.status_code == 204
              
              def get_file_content(self, path):
                  url = f"{self.BASE}/repos/{self.owner}/{self.repo}/contents/{path}"
                  r = requests.get(url, headers=self.headers)
                  if r.status_code == 200:
                      data = r.json()
                      if "content" in data:
                          return base64.b64decode(data["content"].replace("\n", "")).decode("utf-8")
                  return None
              
              def get_chats(self):
                  content = self.get_file_content("telegram_data/chats.json")
                  if content:
                      return json.loads(content)
                  return []
              
              def get_messages(self, chat_id):
                  content = self.get_file_content(f"telegram_data/chat_{chat_id}.json")
                  if content:
                      return json.loads(content)
                  return []
              
              def get_last_update(self):
                  content = self.get_file_content("telegram_data/last_update.json")
                  if content:
                      return json.loads(content)
                  return {}

          # ── App KV Language ──
          KV = '''
          #:import dp kivy.metrics.dp
          #:import MDTopAppBar kivymd.uix.toolbar.MDTopAppBar

          <ChatItem@MDCard>:
              orientation: "vertical"
              padding: dp(12)
              size_hint_y: None
              height: dp(72)
              md_bg_color: app.theme_cls.surfaceColor
              on_release: root.on_chat_click(root.chat_id, root.chat_name)
              BoxLayout:
                  spacing: dp(12)
                  MDCard:
                      size_hint: None, None
                      size: dp(48), dp(48)
                      radius: [dp(24)]
                      md_bg_color: app.theme_cls.primaryContainerColor
                      MDLabel:
                          text: root.avatar_text
                          halign: "center"
                          valign: "center"
                          theme_text_color: "Custom"
                          text_color: app.theme_cls.onPrimaryContainerColor
                          font_style: "Title"
                  BoxLayout:
                      orientation: "vertical"
                      size_hint_x: 1
                      MDLabel:
                          text: root.chat_name
                          font_style: "Subtitle1"
                          shorten: True
                      MDLabel:
                          text: root.last_msg
                          font_style: "Body2"
                          theme_text_color: "Secondary"
                          shorten: True
                  BoxLayout:
                      orientation: "vertical"
                      size_hint_x: None
                      width: dp(48)
                      MDLabel:
                          text: root.time_text
                          font_style: "Caption"
                          halign: "right"
                          theme_text_color: "Secondary"
                      MDCard:
                          size_hint: None, None
                          size: dp(24), dp(24)
                          radius: [dp(12)]
                          md_bg_color: app.theme_cls.primaryColor
                          opacity: 1 if root.unread > 0 else 0
                          MDLabel:
                              text: str(root.unread) if root.unread > 0 else ""
                              font_style: "Caption"
                              halign: "center"
                              valign: "center"
                              theme_text_color: "Custom"
                              text_color: 1,1,1,1

          <MessageBubble@MDCard>:
              padding: dp(8)
              size_hint_y: None
              height: self.minimum_height
              radius: [dp(12)]
              md_bg_color: app.theme_cls.primaryContainerColor if root.is_sent else app.theme_cls.surfaceVariantColor
              pos_hint: {"right": 1} if root.is_sent else {}
              BoxLayout:
                  orientation: "vertical"
                  size_hint_x: None
                  width: min(dp(280), self.texture_size[0] + dp(16))
                  MDLabel:
                      text: root.sender_text
                      font_style: "Caption"
                      theme_text_color: "Custom"
                      text_color: app.theme_cls.primaryColor
                      opacity: 1 if not root.is_sent and root.sender_text else 0
                  MDLabel:
                      text: root.msg_text
                      font_style: "Body1"
                      size_hint_y: None
                      height: self.texture_size[1]

          <ChatDetailScreen>:
              BoxLayout:
                  orientation: "vertical"
                  MDTopAppBar:
                      title: root.chat_name
                      left_action_items: [["arrow-left", lambda x: root.go_back()]]
                  ScrollView:
                      RecycleView:
                          id: msg_list
                          viewclass: "MessageBubble"
                          RecycleBoxLayout:
                              orientation: "vertical"
                              padding: dp(8)
                              spacing: dp(4)
                              size_hint_y: None
                              height: self.minimum_height
                              default_size_hint: 1, None
                  BoxLayout:
                      size_hint_y: None
                      height: dp(56)
                      padding: dp(8)
                      spacing: dp(8)
                      MDTextField:
                          id: msg_input
                          hint_text: "Message..."
                          mode: "round"
                          size_hint_x: 1
                      MDIconButton:
                          icon: "send"
                          on_release: root.send_message(msg_input.text)
          '''

          # ── Screens ──
          class ChatItem(MDCard):
              chat_id = NumericProperty(0)
              chat_name = StringProperty("")
              avatar_text = StringProperty("")
              last_msg = StringProperty("")
              time_text = StringProperty("")
              unread = NumericProperty(0)
              on_chat_click = ObjectProperty(None)

          class MessageBubble(MDCard):
              msg_text = StringProperty("")
              is_sent = BooleanProperty(False)
              sender_text = StringProperty("")

          class ChatDetailScreen(Screen):
              chat_name = StringProperty("")
              chat_id = NumericProperty(0)
              
              def __init__(self, **kwargs):
                  super().__init__(**kwargs)
                  self.messages = []
              
              def go_back(self):
                  self.manager.current = "telegram"
              
              def load_messages(self, msgs):
                  self.messages = msgs
                  rv = self.ids.msg_list
                  rv.data = []
                  for m in reversed(msgs):
                      rv.data.append({
                          "msg_text": m.get("text", ""),
                          "is_sent": m.get("out", False),
                          "sender_text": m.get("sender", ""),
                          "size_hint_y": None,
                          "height": dp(48)
                      })
              
              def send_message(self, text):
                  if not text or not text.strip():
                      return
                  app = MDApp.get_running_app()
                  actions = json.dumps([
                      {"type": "send_message", "chat_id": self.chat_id, "text": text.strip()},
                      {"type": "get_messages", "chat_id": self.chat_id, "limit": 50}
                  ])
                  app.run_workflow(actions)
                  self.ids.msg_input.text = ""
                  MDSnackbar(MDSnackbar(text="Message queued!")).open()

          class SetupScreen(Screen):
              pass

          class LockScreen(Screen):
              pass

          class LogsScreen(Screen):
              pass

          class AboutScreen(Screen):
              pass

          # ── Main App ──
          class LunarVeilApp(MDApp):
              def build(self):
                  Builder.load_string(KV)
                  self.theme_cls.primary_palette = "DeepPurple"
                  self.theme_cls.theme_style = "Dark"
                  self.theme_cls.material_style = "M3"
                  
                  self.store = JsonStore("lunarveil_config.json")
                  self.api = None
                  self.chats = []
                  self.polling = False
                  
                  self.sm = ScreenManager()
                  
                  # Check setup
                  if not self.store.exists("token"):
                      self.sm.add_widget(self.build_setup_screen())
                  elif not self.store.get("unlocked") or False:
                      self.sm.add_widget(self.build_lock_screen())
                  else:
                      self.init_api()
                      self.build_main_screens()
                  
                  return self.sm
              
              def build_setup_screen(self):
                  screen = SetupScreen(name="setup")
                  layout = BoxLayout(orientation="vertical", padding=dp(32), spacing=dp(16))
                  
                  layout.add_widget(MDLabel(text="🌙 Welcome to LunarVeil", font_style="Headline", halign="center"))
                  
                  token_field = MDTextField(hint_text="GitHub Token", password=True, mode="rectangle")
                  owner_field = MDTextField(hint_text="Repo Owner", mode="rectangle")
                  repo_field = MDTextField(hint_text="Repo Name", mode="rectangle")
                  otp_field = MDTextField(hint_text="Set App Password", password=True, mode="rectangle")
                  
                  layout.add_widget(token_field)
                  layout.add_widget(owner_field)
                  layout.add_widget(repo_field)
                  layout.add_widget(otp_field)
                  
                  def save_setup(instance):
                      t = token_field.text.strip()
                      o = owner_field.text.strip()
                      r = repo_field.text.strip()
                      p = otp_field.text.strip()
                      if t and o and r and p:
                          self.store.put("token", value=t)
                          self.store.put("owner", value=o)
                          self.store.put("repo", value=r)
                          self.store.put("otp", value=p)
                          self.store.put("unlocked", value=False)
                          self.init_api()
                          self.sm.clear_widgets()
                          self.build_main_screens()
                          self.sm.current = "telegram"
                          self.fetch_chats()
                  
                  layout.add_widget(MDRaisedButton(text="Save & Continue", on_release=save_setup))
                  screen.add_widget(layout)
                  return screen
              
              def build_lock_screen(self):
                  screen = LockScreen(name="lock")
                  layout = BoxLayout(orientation="vertical", padding=dp(32), spacing=dp(16))
                  
                  layout.add_widget(MDLabel(text="🔒 LunarVeil", font_style="Headline", halign="center"))
                  
                  otp_field = MDTextField(hint_text="Password", password=True, mode="rectangle")
                  layout.add_widget(otp_field)
                  
                  def unlock(instance):
                      if otp_field.text.strip() == self.store.get("otp")["value"]:
                          self.store.put("unlocked", value=True)
                          self.sm.clear_widgets()
                          self.build_main_screens()
                          self.sm.current = "telegram"
                          self.fetch_chats()
                      else:
                          MDSnackbar(MDSnackbar(text="Wrong password!")).open()
                  
                  layout.add_widget(MDRaisedButton(text="Unlock", on_release=unlock))
                  screen.add_widget(layout)
                  return screen
              
              def init_api(self):
                  if self.store.exists("token"):
                      t = self.store.get("token")["value"]
                      o = self.store.get("owner")["value"]
                      r = self.store.get("repo")["value"]
                      self.api = GitHubAPI(t, o, r)
              
              def build_main_screens(self):
                  # Telegram Screen
                  tg_screen = Screen(name="telegram")
                  tg_layout = BoxLayout(orientation="vertical")
                  
                  toolbar = MDTopAppBar(
                      title="LunarVeil",
                      left_action_items=[["menu", lambda x: self.open_menu()]],
                      right_action_items=[
                          ["refresh", lambda x: self.fetch_chats()],
                          ["play", lambda x: self.run_workflow_action()]
                      ]
                  )
                  tg_layout.add_widget(toolbar)
                  
                  self.chat_list = RecycleView()
                  self.chat_list.viewclass = "ChatItem"
                  self.chat_layout = RecycleBoxLayout(
                      orientation="vertical",
                      size_hint_y=None,
                      height=dp(72),
                      default_size_hint=(1, None)
                  )
                  self.chat_layout.bind(minimum_height=self.chat_layout.setter("height"))
                  self.chat_list.add_widget(self.chat_layout)
                  tg_layout.add_widget(self.chat_list)
                  
                  tg_screen.add_widget(tg_layout)
                  self.sm.add_widget(tg_screen)
                  
                  # Chat Detail Screen (created dynamically)
                  self.chat_detail = None
                  
                  # Logs Screen
                  logs_screen = LogsScreen(name="logs")
                  logs_layout = BoxLayout(orientation="vertical")
                  logs_toolbar = MDTopAppBar(title="Logs")
                  self.logs_label = MDLabel(text="", font_style="Caption")
                  logs_scroll = ScrollView()
                  logs_scroll.add_widget(self.logs_label)
                  logs_layout.add_widget(logs_toolbar)
                  logs_layout.add_widget(logs_scroll)
                  logs_screen.add_widget(logs_layout)
                  self.sm.add_widget(logs_screen)
                  
                  # About Screen
                  about_screen = AboutScreen(name="about")
                  about_layout = BoxLayout(orientation="vertical", padding=dp(32), spacing=dp(16))
                  about_layout.add_widget(MDLabel(text="🌙", font_style="Display", halign="center"))
                  about_layout.add_widget(MDLabel(text="LunarVeil", font_style="Headline", halign="center"))
                  about_layout.add_widget(MDLabel(text=f"v{VERSION}", font_style="Subtitle1", halign="center"))
                  about_layout.add_widget(MDLabel(text="Telegram Bridge Client", halign="center"))
                  about_layout.add_widget(MDLabel(text="Powered by GitHub Actions", font_style="Caption", halign="center"))
                  about_layout.add_widget(MDLabel(text="me.lunarveil", font_style="Caption", halign="center"))
                  about_screen.add_widget(about_layout)
                  self.sm.add_widget(about_screen)
                  
                  # Navigation
                  nav_layout = BoxLayout(size_hint_y=None, height=dp(56))
                  nav_layout.add_widget(MDRaisedButton(text="Chats", on_release=lambda x: setattr(self.sm, "current", "telegram")))
                  nav_layout.add_widget(MDRaisedButton(text="Logs", on_release=lambda x: setattr(self.sm, "current", "logs")))
                  nav_layout.add_widget(MDRaisedButton(text="About", on_release=lambda x: setattr(self.sm, "current", "about")))
                  tg_layout.add_widget(nav_layout)
              
              def log(self, msg):
                  self.logs_label.text += msg + "\n"
                  print(msg)
              
              def fetch_chats(self):
                  if not self.api:
                      return
                  self.log("Fetching chats...")
                  def do_fetch():
                      try:
                          chats = self.api.get_chats()
                          Clock.schedule_once(lambda dt: self.update_chat_list(chats))
                          self.log(f"Loaded {len(chats)} chats")
                      except Exception as e:
                          self.log(f"Error: {e}")
                  threading.Thread(target=do_fetch).start()
              
              def update_chat_list(self, chats):
                  self.chats = chats
                  self.chat_layout.clear_widgets()
                  for c in chats:
                      item = ChatItem()
                      item.chat_id = c["id"]
                      item.chat_name = c["name"]
                      item.avatar_text = c["name"][0].upper()
                      item.last_msg = c.get("last_msg", "")
                      item.unread = c.get("unread", 0)
                      item.on_chat_click = self.open_chat
                      self.chat_layout.add_widget(item)
              
              def open_chat(self, chat_id, chat_name):
                  self.log(f"Opening chat {chat_id}: {chat_name}")
                  if not self.api:
                      return
                  
                  if not self.chat_detail:
                      self.chat_detail = ChatDetailScreen(name="chat_detail")
                      self.chat_detail.go_back = lambda: setattr(self.sm, "current", "telegram")
                      self.sm.add_widget(self.chat_detail)
                  
                  self.chat_detail.chat_name = chat_name
                  self.chat_detail.chat_id = chat_id
                  
                  def do_load():
                      try:
                          msgs = self.api.get_messages(chat_id)
                          Clock.schedule_once(lambda dt: self.chat_detail.load_messages(msgs))
                          self.log(f"Loaded {len(msgs)} messages")
                      except Exception as e:
                          self.log(f"Error loading messages: {e}")
                  
                  threading.Thread(target=do_load).start()
                  self.sm.current = "chat_detail"
              
              def run_workflow_action(self):
                  if not self.api:
                      self.log("API not initialized")
                      return
                  actions = json.dumps([{"type": "get_chats"}])
                  self.run_workflow(actions)
              
              def run_workflow(self, actions_json):
                  if not self.api:
                      return
                  self.log("Triggering workflow...")
                  def do_trigger():
                      ok = self.api.trigger_workflow(actions_json)
                      if ok:
                          self.log("Workflow triggered! Waiting...")
                          self.poll_workflow()
                      else:
                          self.log("Failed to trigger workflow")
                  threading.Thread(target=do_trigger).start()
              
              def poll_workflow(self):
                  if self.polling:
                      return
                  self.polling = True
                  def check():
                      for i in range(24):  # 2 minutes
                          time.sleep(5)
                          try:
                              lu = self.api.get_last_update()
                              if lu and lu.get("timestamp"):
                                  self.log("Workflow completed!")
                                  self.fetch_chats()
                                  self.polling = False
                                  return
                          except:
                              pass
                      self.log("Workflow may still be running...")
                      self.polling = False
                  threading.Thread(target=check).start()
              
              def open_menu(self):
                  menu_items = [
                      {"text": "Run Workflow", "on_release": lambda: self.run_workflow_action()},
                      {"text": "Fetch Results", "on_release": lambda: self.fetch_chats()},
                      {"text": "Settings", "on_release": lambda: self.log("Settings coming soon")},
                  ]
                  # Simple menu via dialog
                  dialog = MDDialog(title="Menu", buttons=[
                      MDFlatButton(text=item["text"], on_release=item["on_release"]) for item in menu_items
                  ])
                  dialog.open()

          if __name__ == "__main__":
              LunarVeilApp().run()
          EOF

          # ── buildozer.spec ──
          cat > lunarveil_app/buildozer.spec << EOF
          [app]
          title = LunarVeil
          package.name = lunarveil
          package.domain = me.lunarveil
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = $VERSION
          requirements = python3,kivy==2.3.0,kivymd==2.0.1.dev0,https://github.com/kivymd/KivyMD/archive/master.zip,requests==2.31.0,urllib3==2.1.0,certifi==2023.11.17,charset-normalizer==3.3.2,idna==3.6
          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 2.3.0
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 31
          android.minapi = 26
          android.ndk = 25b
          android.sdk = 33
          android.gradle_dependencies = 
          android.arch = arm64-v8a
          p4a.branch = develop
          ios.kivy_ios_url = https://github.com/kivy/kivy-ios
          ios.kivy_ios_branch = master
          ios.ios_deploy_url = https://github.com/phonegap/ios-deploy
          ios.ios_deploy_branch = 1.10.0
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Buildozer
        uses: docker://kivy/buildozer:latest
        with:
          args: -v ${{ github.workspace }}/lunarveil_app:/app buildozer android debug

      - name: Split APK
        run: |
          APK_PATH=$(find lunarveil_app/bin -name '*.apk' | head -n 1)
          APK_NAME="LunarVeil_v$VERSION.apk"
          BUILD_DIR="builds/$VERSION"
          mkdir -p "$BUILD_DIR"
          cp "$APK_PATH" "$BUILD_DIR/$APK_NAME"
          cd "$BUILD_DIR"
          zip "LunarVeil_v$VERSION.zip" "$APK_NAME"
          CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d --numeric-suffixes=1 -a 3 "LunarVeil_v$VERSION.zip" "LunarVeil_v$VERSION.zip."
          rm "LunarVeil_v$VERSION.zip" "$APK_NAME"
          TOTAL_SIZE=0
          for f in LunarVeil_v$VERSION.zip.*; do TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$f"))); done
          NUM_CHUNKS=$(ls LunarVeil_v$VERSION.zip.* 2>/dev/null | wc -l)
          cat > info.json << INFO
          {"version":"$VERSION","zip_name":"LunarVeil_v$VERSION.zip","total_size":$TOTAL_SIZE,"total_chunks":$NUM_CHUNKS,"chunk_size_mb":$CHUNK_SIZE_MB,"download_urls":[
          INFO
          for i in $(seq 1 $NUM_CHUNKS); do
            PADDED=$(printf "%03d" $i)
            echo "    \"https://raw.githubusercontent.com/${{ github.repository }}/main/$BUILD_DIR/LunarVeil_v${VERSION}.zip.${PADDED}\"," >> info.json
          done
          sed -i '$ s/,$//' info.json
          echo '  ]}' >> info.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds/
          git commit -m "LunarVeil v$VERSION (Python)" || echo "No changes"
          git push