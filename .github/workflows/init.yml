name: Build & Release LunarVeil APK (Kotlin)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Max size per split file (MB)'
        default: '90'
        required: false
      clean_old_builds:
        description: 'Delete all previous builds'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '90' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || (git commit -m "Clean old builds" && git push)
          git pull

      - name: Generate Kotlin app source
        run: |
          rm -rf app/src/main/java
          mkdir -p app/src/main/java/me/lunarveil/ui/theme
          mkdir -p app/src/main/java/me/lunarveil/ui/screens
          mkdir -p app/src/main/java/me/lunarveil/data/local
          mkdir -p app/src/main/java/me/lunarveil/data/remote
          mkdir -p app/src/main/java/me/lunarveil/data/model
          mkdir -p app/src/main/java/me/lunarveil/data/repository
          mkdir -p app/src/main/java/me/lunarveil/navigation
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          # gradle.properties
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # settings.gradle.kts
          cat > settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "LunarVeil"; include(":app")
          EOF

          # build.gradle.kts
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME;distributionPath=wrapper/dists;distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip;zipStoreBase=GRADLE_USER_HOME;zipStorePath=wrapper/dists
          EOF

          # app/build.gradle.kts - NO ROOM, NO KAPT
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "me.lunarveil"
              compileSdk = 34

              defaultConfig {
                  applicationId = "me.lunarveil"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = System.getenv("VERSION") ?: "1.0.0"
              }

              buildTypes {
                  debug {}
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("com.squareup.retrofit2:retrofit:2.9.0")
              implementation("com.squareup.retrofit2:converter-gson:2.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
              implementation("androidx.datastore:datastore-preferences:1.0.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF
          touch app/proguard-rules.pro

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="LunarVeil" android:roundIcon="@mipmap/ic_launcher_round" android:supportsRtl="true" android:theme="@style/Theme.LunarVeil">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.LunarVeil">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.LunarVeil" parent="android:Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@color/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@color/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cat > app/src/main/res/values/ic_launcher_colors.xml << 'EOF'
          <resources><color name="ic_launcher_background">#6750A4</color><color name="ic_launcher_foreground">#FFFFFF</color></resources>
          EOF

          # Theme.kt
          cat > app/src/main/java/me/lunarveil/ui/theme/Theme.kt << 'EOF'
          package me.lunarveil.ui.theme
          import android.os.Build; import androidx.compose.foundation.isSystemInDarkTheme; import androidx.compose.material3.*; import androidx.compose.runtime.Composable; import androidx.compose.ui.graphics.Color; import androidx.compose.ui.platform.LocalContext
          @Composable fun LunarVeilTheme(dark: Boolean = isSystemInDarkTheme(), dynamic: Boolean = true, content: @Composable () -> Unit) {
              val cs = when { dynamic && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S -> { val c = LocalContext.current; if (dark) dynamicDarkColorScheme(c) else dynamicLightColorScheme(c) } dark -> darkColorScheme(primary = Color(0xFFD0BCFF), secondary = Color(0xFFCCC2DC), tertiary = Color(0xFFEFB8C8), background = Color(0xFF1C1B1F), surface = Color(0xFF1C1B1F)) else -> lightColorScheme(primary = Color(0xFF6750A4), secondary = Color(0xFF625B71), tertiary = Color(0xFF7D5260), background = Color(0xFFFFFBFE), surface = Color(0xFFFFFBFE)) }
              MaterialTheme(colorScheme = cs, content = content)
          }
          EOF

          # Models.kt
          cat > app/src/main/java/me/lunarveil/data/model/Models.kt << 'EOF'
          package me.lunarveil.data.model
          data class Chat(val id: Long, val name: String, val type: String, val unread: Int, val lastMsg: String, val lastDate: String?, val archived: Boolean, val username: String? = null, val phone: String? = null, val lastMedia: String? = null)
          data class Message(val id: Long, val date: String?, val text: String, val out: Boolean, val sender: String, val media: String? = null)
          EOF

          # GitHubApi.kt
          cat > app/src/main/java/me/lunarveil/data/remote/GitHubApi.kt << 'EOF'
          package me.lunarveil.data.remote
          import retrofit2.Response; import retrofit2.http.*
          interface GitHubApi {
              @POST("repos/{owner}/{repo}/actions/workflows/telegram.yml/dispatches")
              suspend fun trigger(@Path("owner") o: String, @Path("repo") r: String, @Body b: TriggerBody, @Header("Authorization") a: String): Response<Unit>
              @GET("repos/{owner}/{repo}/contents/telegram_data/chats.json")
              suspend fun getChats(@Path("owner") o: String, @Path("repo") r: String, @Header("Authorization") a: String): GitHubContent
              @GET("repos/{owner}/{repo}/contents/telegram_data/chat_{id}.json")
              suspend fun getMessages(@Path("owner") o: String, @Path("repo") r: String, @Path("id") id: Long, @Header("Authorization") a: String): GitHubContent
              @GET("repos/{owner}/{repo}/contents/telegram_data/last_update.json")
              suspend fun getLastUpdate(@Path("owner") o: String, @Path("repo") r: String, @Header("Authorization") a: String): GitHubContent
          }
          data class TriggerBody(val ref: String = "main", val inputs: TriggerInputs)
          data class TriggerInputs(val actions_json: String)
          data class GitHubContent(val content: String?, val encoding: String?)
          EOF

          # RetrofitClient.kt
          cat > app/src/main/java/me/lunarveil/data/remote/RetrofitClient.kt << 'EOF'
          package me.lunarveil.data.remote
          import okhttp3.OkHttpClient; import retrofit2.Retrofit; import retrofit2.converter.gson.GsonConverterFactory; import java.util.concurrent.TimeUnit
          object RetrofitClient {
              private val client = OkHttpClient.Builder().connectTimeout(30, TimeUnit.SECONDS).readTimeout(30, TimeUnit.SECONDS).build()
              private val retrofit = Retrofit.Builder().baseUrl("https://api.github.com/").client(client).addConverterFactory(GsonConverterFactory.create()).build()
              val api: GitHubApi = retrofit.create(GitHubApi::class.java)
          }
          EOF

          # TelegramRepository.kt
          cat > app/src/main/java/me/lunarveil/data/repository/TelegramRepository.kt << 'EOF'
          package me.lunarveil.data.repository
          import android.util.Base64; import com.google.gson.Gson; import com.google.gson.reflect.TypeToken; import me.lunarveil.data.model.*; import me.lunarveil.data.remote.*
          class TelegramRepository(private val api: GitHubApi, private val token: String, private val owner: String, private val repo: String) {
              private val gson = Gson(); private val auth = "Bearer $token"
              suspend fun trigger(actions: String) = try { api.trigger(owner, repo, TriggerBody(inputs = TriggerInputs(actions)), auth).isSuccessful } catch (e: Exception) { false }
              suspend fun getChats(): List<Chat> = try { val c = api.getChats(owner, repo, auth); val j = decode(c.content); gson.fromJson(j, object : TypeToken<List<Chat>>() {}.type) ?: emptyList() } catch (e: Exception) { emptyList() }
              suspend fun getMessages(chatId: Long): List<Message> = try { val c = api.getMessages(owner, repo, chatId, auth); val j = decode(c.content); gson.fromJson(j, object : TypeToken<List<Message>>() {}.type) ?: emptyList() } catch (e: Exception) { emptyList() }
              suspend fun getLastUpdate(): String? = try { val c = api.getLastUpdate(owner, repo, auth); gson.fromJson(decode(c.content), Map::class.java)?.get("timestamp") as? String } catch (e: Exception) { null }
              private fun decode(c: String?) = if (c != null) try { String(Base64.decode(c.replace("\n", ""), Base64.DEFAULT)) } catch (e: Exception) { "" } else ""
          }
          EOF

          # AppPreferences.kt
          cat > app/src/main/java/me/lunarveil/data/local/AppPreferences.kt << 'EOF'
          package me.lunarveil.data.local
          import android.content.Context; import androidx.datastore.core.DataStore; import androidx.datastore.preferences.core.*; import androidx.datastore.preferences.preferencesDataStore; import kotlinx.coroutines.flow.Flow; import kotlinx.coroutines.flow.map
          private val Context.ds: DataStore<Preferences> by preferencesDataStore(name = "lv")
          class AppPreferences(private val ctx: Context) {
              private val TK = stringPreferencesKey("token"); private val TO = stringPreferencesKey("owner"); private val TR = stringPreferencesKey("repo"); private val TOK = stringPreferencesKey("otp"); private val TS = booleanPreferencesKey("setup")
              val token: Flow<String> = ctx.ds.data.map { it[TK] ?: "" }; val owner: Flow<String> = ctx.ds.data.map { it[TO] ?: "" }; val repo: Flow<String> = ctx.ds.data.map { it[TR] ?: "" }; val otp: Flow<String> = ctx.ds.data.map { it[TOK] ?: "" }; val isSetup: Flow<Boolean> = ctx.ds.data.map { it[TS] ?: false }
              suspend fun save(t: String, o: String, r: String, p: String) { ctx.ds.edit { it[TK] = t; it[TO] = o; it[TR] = r; it[TOK] = p; it[TS] = true } }
          }
          EOF

          # Logger.kt
          cat > app/src/main/java/me/lunarveil/ui/screens/Logger.kt << 'EOF'
          package me.lunarveil.ui.screens
          import androidx.compose.runtime.mutableStateListOf
          object Logger { val logs = mutableStateListOf<String>(); fun i(t: String, m: String) { logs.add("[INFO][$t] $m") }; fun e(t: String, m: String) { logs.add("[ERROR][$t] $m") } }
          EOF

          # MainActivity.kt (COMPLETE APP)
          cat > app/src/main/java/me/lunarveil/MainActivity.kt << 'MAINEOF'
          package me.lunarveil

          import android.os.Bundle
          import android.util.Base64
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material.icons.outlined.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.navigation.NavDestination.Companion.hierarchy
          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.compose.*
          import com.google.gson.Gson
          import kotlinx.coroutines.*
          import me.lunarveil.BuildConfig
          import me.lunarveil.data.local.AppPreferences
          import me.lunarveil.data.model.Chat
          import me.lunarveil.data.model.Message
          import me.lunarveil.data.remote.RetrofitClient
          import me.lunarveil.data.repository.TelegramRepository
          import me.lunarveil.ui.screens.Logger
          import me.lunarveil.ui.theme.LunarVeilTheme
          import okhttp3.*
          import retrofit2.Retrofit
          import retrofit2.converter.gson.GsonConverterFactory
          import retrofit2.http.*
          import java.util.concurrent.TimeUnit

          class MainActivity : ComponentActivity() {
              private val prefs by lazy { AppPreferences(this) }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val done = runBlocking { prefs.isSetup.first() }
                  val otp = runBlocking { prefs.otp.first() }
                  setContent {
                      LunarVeilTheme {
                          var showSetup by remember { mutableStateOf(!done) }
                          var showLock by remember { mutableStateOf(done) }
                          var savedOtp by remember { mutableStateOf(otp) }
                          if (showSetup) SetupScreen { t, o, r, p ->
                              runBlocking { prefs.save(t, o, r, p); savedOtp = p }
                              showSetup = false; showLock = false
                          }
                          else if (showLock) LockScreen(savedOtp) { showLock = false }
                          else MainApp(prefs)
                      }
                  }
              }
          }

          @Composable
          fun SetupScreen(onDone: (String, String, String, String) -> Unit) {
              var t by remember { mutableStateOf("") }; var o by remember { mutableStateOf("") }; var r by remember { mutableStateOf("") }; var p by remember { mutableStateOf("") }
              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(Modifier.fillMaxSize().padding(32.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                      Text("🌙 LunarVeil", style = MaterialTheme.typography.headlineLarge); Spacer(Modifier.height(24.dp))
                      OutlinedTextField(t, { t = it }, label = { Text("GitHub Token") }, visualTransformation = PasswordVisualTransformation(), singleLine = true, modifier = Modifier.fillMaxWidth())
                      Spacer(Modifier.height(8.dp)); OutlinedTextField(o, { o = it }, label = { Text("Repo Owner") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                      Spacer(Modifier.height(8.dp)); OutlinedTextField(r, { r = it }, label = { Text("Repo Name") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                      Spacer(Modifier.height(8.dp)); OutlinedTextField(p, { p = it }, label = { Text("App Password") }, visualTransformation = PasswordVisualTransformation(), singleLine = true, modifier = Modifier.fillMaxWidth())
                      Spacer(Modifier.height(24.dp)); Button({ onDone(t, o, r, p) }, enabled = t.isNotBlank() && o.isNotBlank() && r.isNotBlank() && p.isNotBlank(), modifier = Modifier.fillMaxWidth()) { Text("Continue") }
                  }
              }
          }

          @Composable
          fun LockScreen(otp: String, onUnlock: () -> Unit) {
              var p by remember { mutableStateOf("") }; var err by remember { mutableStateOf(false) }
              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(Modifier.fillMaxSize().padding(32.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                      Text("🔒 LunarVeil", style = MaterialTheme.typography.headlineLarge); Spacer(Modifier.height(24.dp))
                      OutlinedTextField(p, { p = it; err = false }, label = { Text("Password") }, visualTransformation = PasswordVisualTransformation(), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password), singleLine = true, isError = err, modifier = Modifier.fillMaxWidth())
                      if (err) Text("Wrong password", color = MaterialTheme.colorScheme.error)
                      Spacer(Modifier.height(24.dp)); Button({ if (p == otp) onUnlock() else err = true }, Modifier.fillMaxWidth()) { Text("Unlock") }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainApp(prefs: AppPreferences) {
              val nav = rememberNavController(); val drawer = rememberDrawerState(DrawerValue.Closed); val scope = rememberCoroutineScope()
              var chats by remember { mutableStateOf<List<Chat>>(emptyList()) }; var msgs by remember { mutableStateOf<List<Message>>(emptyList()) }; var loading by remember { mutableStateOf(false) }
              var cId by remember { mutableStateOf<Long?>(null) }; var cName by remember { mutableStateOf("") }
              var repo by remember { mutableStateOf<TelegramRepository?>(null) }
              var snackbar by remember { mutableStateOf("") }
              val snackHost = remember { SnackbarHostState() }

              LaunchedEffect(Unit) {
                  val tk = prefs.token.first(); val to = prefs.owner.first(); val tr = prefs.repo.first()
                  if (tk.isNotBlank() && to.isNotBlank() && tr.isNotBlank()) {
                      repo = TelegramRepository(RetrofitClient.api, tk, to, tr)
                      loading = true; chats = repo!!.getChats(); loading = false
                      Logger.i("Main", "Loaded ${chats.size} chats")
                  }
              }

              val screens = listOf("Chats" to Icons.Outlined.Chat to Icons.Filled.Chat, "Logs" to Icons.Outlined.List to Icons.Filled.List, "About" to Icons.Outlined.Info to Icons.Filled.Info)
              val backStack by nav.currentBackStackEntryAsState(); val dest = backStack?.destination; val isDetail = dest?.route == "detail" || dest?.route == "settings"

              Scaffold(
                  snackbarHost = { SnackbarHost(snackHost) },
                  topBar = { if (!isDetail) TopAppBar(title = { Text("LunarVeil") }, navigationIcon = { IconButton({ scope.launch { drawer.open() } }) { Icon(Icons.Default.Menu, "Menu") } }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface)) },
                  bottomBar = { if (!isDetail) NavigationBar { screens.forEachIndexed { i, s -> val sel = dest?.hierarchy?.any { it.route == "screen_$i" } == true; NavigationBarItem(icon = { Icon(if (sel) s.second else s.first, "tab") }, label = { Text(s.first.first) }, selected = sel, onClick = { nav.navigate("screen_$i") { popUpTo(nav.graph.findStartDestination().id) { saveState = true }; launchSingleTop = true; restoreState = true } }) } } }
              ) { inner ->
                  NavHost(nav, "screen_0", Modifier.padding(inner)) {
                      composable("screen_0") {
                          if (loading) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }
                          else if (chats.isEmpty()) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("No chats. Use menu to fetch.", color = MaterialTheme.colorScheme.onSurfaceVariant) }
                          else {
                              val main = chats.filter { !it.archived }; val arch = chats.filter { it.archived }
                              LazyColumn(Modifier.fillMaxSize()) {
                                  items(main) { c -> ChatRow(c) { cId = c.id; cName = c.name; scope.launch { msgs = repo?.getMessages(c.id) ?: emptyList(); nav.navigate("detail") } } }
                                  if (arch.isNotEmpty()) { item { Text("📦 Archived", Modifier.padding(12.dp), color = MaterialTheme.colorScheme.onSurfaceVariant) }; items(arch) { c -> ChatRow(c) { cId = c.id; cName = c.name; scope.launch { msgs = repo?.getMessages(c.id) ?: emptyList(); nav.navigate("detail") } } } }
                              }
                          }
                      }
                      composable("detail") { ChatScreen(cName, msgs, { nav.popBackStack() }, { txt -> scope.launch { repo?.trigger(Gson().toJson(listOf(mapOf("type" to "send_message", "chat_id" to cId, "text" to txt), mapOf("type" to "get_messages", "chat_id" to cId, "limit" to 50)))); snackbar = "Sent!"; snackHost.showSnackbar("Message queued!") } }) }
                      composable("settings") { val t = runBlocking { prefs.token.first() }; val o = runBlocking { prefs.owner.first() }; val r = runBlocking { prefs.repo.first() }; SettingsScreen(t, o, r) { nav.popBackStack() } }
                      composable("screen_1") { LogsScreen() }
                      composable("screen_2") { AboutScreen(BuildConfig.VERSION_NAME) }
                  }
              }

              ModalNavigationDrawer(drawerState = drawer, drawerContent = {
                  ModalDrawerSheet { Spacer(Modifier.height(16.dp)); Text("LunarVeil", Modifier.padding(16.dp), style = MaterialTheme.typography.headlineSmall); HorizontalDivider()
                      NavigationDrawerItem(icon = { Text("▶") }, label = { Text("Run Workflow") }, selected = false, onClick = { scope.launch { drawer.close(); repo?.trigger(Gson().toJson(listOf(mapOf("type" to "get_chats")))); snackHost.showSnackbar("Workflow triggered! Wait ~30s then Fetch.") } })
                      NavigationDrawerItem(icon = { Text("⬇") }, label = { Text("Fetch Results") }, selected = false, onClick = { scope.launch { drawer.close(); loading = true; chats = repo?.getChats() ?: emptyList(); loading = false; snackHost.showSnackbar("Fetched ${chats.size} chats") } })
                      HorizontalDivider()
                      NavigationDrawerItem(icon = { Text("⚙") }, label = { Text("Settings") }, selected = false, onClick = { scope.launch { drawer.close(); nav.navigate("settings") } })
                  }
              })
          }

          @Composable
          fun ChatRow(c: Chat, onClick: () -> Unit) {
              Surface(Modifier.fillMaxWidth().clickable(onClick = onClick), color = MaterialTheme.colorScheme.surface) {
                  Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                      Surface(Modifier.size(48.dp), shape = MaterialTheme.shapes.extraLarge, color = MaterialTheme.colorScheme.primaryContainer) { Box(contentAlignment = Alignment.Center) { Text(c.name.take(1).uppercase(), color = MaterialTheme.colorScheme.onPrimaryContainer) } }
                      Spacer(Modifier.width(12.dp)); Column(Modifier.weight(1f)) { Text(c.name, style = MaterialTheme.typography.bodyLarge, fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis); Text(c.lastMsg.ifEmpty { c.lastMedia?.let { "📎 Media" } ?: "" }, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1, overflow = TextOverflow.Ellipsis) }
                      if (c.unread > 0) Surface(shape = MaterialTheme.shapes.small, color = MaterialTheme.colorScheme.primary) { Text("${c.unread}", Modifier.padding(horizontal = 6.dp, vertical = 2.dp), style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onPrimary) }
                  }
              }
          }

          @Composable
          fun ChatScreen(name: String, messages: List<Message>, onBack: () -> Unit, onSend: (String) -> Unit) {
              var input by remember { mutableStateOf("") }; val list = rememberLazyListState()
              LaunchedEffect(messages.size) { if (messages.isNotEmpty()) list.animateScrollToItem(0) }
              Column(Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth().padding(8.dp), verticalAlignment = Alignment.CenterVertically) { TextButton(onBack) { Text("←") }; Text(name, style = MaterialTheme.typography.titleMedium, maxLines = 1, overflow = TextOverflow.Ellipsis) }
                  HorizontalDivider()
                  LazyColumn(state = list, modifier = Modifier.weight(1f).padding(horizontal = 8.dp), reverseLayout = true) {
                      items(messages.reversed()) { m ->
                          val sent = m.out
                          Column(Modifier.fillMaxWidth().padding(vertical = 2.dp), horizontalAlignment = if (sent) Alignment.End else Alignment.Start) {
                              Surface(shape = MaterialTheme.shapes.medium, color = if (sent) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant, modifier = Modifier.widthIn(max = 280.dp)) {
                                  Column(Modifier.padding(8.dp)) {
                                      if (!sent && m.sender.isNotBlank()) Text(m.sender, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.primary)
                                      if (m.text.isNotBlank()) Text(m.text, style = MaterialTheme.typography.bodyMedium)
                                      if (!m.media.isNullOrEmpty()) Text("📎 ${m.media}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                              }
                          }
                      }
                  }
                  HorizontalDivider()
                  Row(Modifier.fillMaxWidth().padding(8.dp), verticalAlignment = Alignment.CenterVertically) { OutlinedTextField(input, { input = it }, Modifier.weight(1f), placeholder = { Text("Message...") }, singleLine = true); Spacer(Modifier.width(8.dp)); Button({ if (input.isNotBlank()) { onSend(input); input = "" } }) { Text("Send") } }
              }
          }

          @Composable
          fun LogsScreen() { val list = rememberLazyListState(); val scope = rememberCoroutineScope(); LaunchedEffect(Logger.logs.size) { if (Logger.logs.isNotEmpty()) scope.launch { list.animateScrollToItem(Logger.logs.size - 1) } }; Column(Modifier.fillMaxSize()) { Row(Modifier.fillMaxWidth().padding(8.dp), horizontalArrangement = Arrangement.End) { TextButton({ Logger.logs.clear() }) { Text("Clear") } }; LazyColumn(state = list, Modifier.fillMaxSize()) { items(Logger.logs.toList()) { Text(it, style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(horizontal = 12.dp, vertical = 2.dp)) } } } }

          @Composable
          fun SettingsScreen(t: String, o: String, r: String, onBack: () -> Unit) {
              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(Modifier.fillMaxSize().padding(16.dp)) {
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) { TextButton(onBack) { Text("← Back") }; Spacer(Modifier.weight(1f)); Text("Settings", style = MaterialTheme.typography.titleLarge) }
                      Spacer(Modifier.height(16.dp)); Text("GitHub", style = MaterialTheme.typography.titleMedium); Spacer(Modifier.height(8.dp))
                      ListItem(headlineContent = { Text("Token") }, supportingContent = { Text(t.take(8) + "..." + t.takeLast(4)) })
                      ListItem(headlineContent = { Text("Repo") }, supportingContent = { Text("$o/$r") })
                      HorizontalDivider(); Spacer(Modifier.height(16.dp)); Text("App", style = MaterialTheme.typography.titleMedium); Spacer(Modifier.height(8.dp))
                      ListItem(headlineContent = { Text("Version") }, supportingContent = { Text(BuildConfig.VERSION_NAME) })
                  }
              }
          }

          @Composable
          fun AboutScreen(v: String) {
              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(Modifier.fillMaxSize().padding(32.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                      Text("🌙", style = MaterialTheme.typography.displayLarge); Spacer(Modifier.height(12.dp)); Text("LunarVeil", style = MaterialTheme.typography.headlineLarge); Text("v$v", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      Spacer(Modifier.height(24.dp)); Text("Telegram Bridge Client"); Text("Powered by GitHub Actions", color = MaterialTheme.colorScheme.onSurfaceVariant); Spacer(Modifier.height(24.dp)); Text("me.lunarveil", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }
          MAINEOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Split APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1); APK_NAME="LunarVeil_v$VERSION.apk"; BUILD_DIR="builds/$VERSION"; mkdir -p "$BUILD_DIR"; cp "$APK_PATH" "$BUILD_DIR/$APK_NAME"
          cd "$BUILD_DIR"; zip "LunarVeil_v$VERSION.zip" "$APK_NAME"; CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d --numeric-suffixes=1 -a 3 "LunarVeil_v$VERSION.zip" "LunarVeil_v$VERSION.zip."; rm "LunarVeil_v$VERSION.zip" "$APK_NAME"
          TOTAL_SIZE=0; for f in LunarVeil_v$VERSION.zip.*; do TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$f"))); done; NUM_CHUNKS=$(ls LunarVeil_v$VERSION.zip.* 2>/dev/null | wc -l)
          cat > info.json << INFO
          {"version":"$VERSION","zip_name":"LunarVeil_v$VERSION.zip","total_size":$TOTAL_SIZE,"total_chunks":$NUM_CHUNKS,"chunk_size_mb":$CHUNK_SIZE_MB,"download_urls":[
          INFO
          for i in $(seq 1 $NUM_CHUNKS); do PADDED=$(printf "%03d" $i); echo "    \"https://raw.githubusercontent.com/${{ github.repository }}/main/$BUILD_DIR/LunarVeil_v${VERSION}.zip.${PADDED}\"," >> info.json; done
          sed -i '$ s/,$//' info.json; echo '  ]}' >> info.json

      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add builds/; git commit -m "LunarVeil v$VERSION" || echo "No changes"; git push