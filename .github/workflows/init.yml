          MAINEOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Split APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          APK_NAME="LunarVeil_v$VERSION.apk"
          BUILD_DIR="builds/$VERSION"
          mkdir -p "$BUILD_DIR"
          cp "$APK_PATH" "$BUILD_DIR/$APK_NAME"
          cd "$BUILD_DIR"
          ZIP_NAME="LunarVeil_v$VERSION.zip"
          zip "$ZIP_NAME" "$APK_NAME"
          rm "$APK_NAME"
          CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d --numeric-suffixes=1 -a 3 "$ZIP_NAME" "$ZIP_NAME."
          rm "$ZIP_NAME"
          TOTAL_SIZE=0
          for f in "$ZIP_NAME."*; do
            TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$f")))
          done
          NUM_CHUNKS=$(ls "$ZIP_NAME."* 2>/dev/null | wc -l)
          cat > info.json << INFO
          {
            "version": "$VERSION",
            "zip_name": "$ZIP_NAME",
            "total_size": $TOTAL_SIZE,
            "total_chunks": $NUM_CHUNKS,
            "chunk_size_mb": $CHUNK_SIZE_MB,
            "download_urls": [
          INFO
          for i in $(seq 1 $NUM_CHUNKS); do
            PADDED=$(printf "%03d" $i)
            echo "    \"https://raw.githubusercontent.com/${{ github.repository }}/main/$BUILD_DIR/${ZIP_NAME}.${PADDED}\"," >> info.json
          done
          sed -i '$ s/,$//' info.json
          echo '  ]' >> info.json
          echo '}' >> info.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds/
          git commit -m "🌙 LunarVeil v$VERSION" || echo "No changes"
          git push