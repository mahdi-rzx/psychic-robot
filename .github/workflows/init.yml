name: Build & Release LunarVeil APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Max size per split file (MB)'
        default: '90'
        required: false
      clean_old_builds:
        description: 'Delete all previous builds'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '90' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || (git commit -m "Clean old builds" && git push)
          git pull

      - name: Generate app source
        run: |
          rm -rf app/src/main/java/me/lunarveil
          mkdir -p app/src/main/java/me/lunarveil/ui/theme
          mkdir -p app/src/main/java/me/lunarveil/ui/screens
          mkdir -p app/src/main/java/me/lunarveil/ui/components
          mkdir -p app/src/main/java/me/lunarveil/data/local
          mkdir -p app/src/main/java/me/lunarveil/data/remote
          mkdir -p app/src/main/java/me/lunarveil/data/model
          mkdir -p app/src/main/java/me/lunarveil/data/repository
          mkdir -p app/src/main/java/me/lunarveil/navigation
          mkdir -p app/src/main/java/me/lunarveil/viewmodel
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          # ========== GRADLE FILES ==========
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LunarVeil"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("org.jetbrains.kotlin.kapt") version "1.9.22" apply false
          }
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.kapt")
          }

          android {
              namespace = "me.lunarveil"
              compileSdk = 34

              defaultConfig {
                  applicationId = "me.lunarveil"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = System.getenv("VERSION") ?: "1.0.0"
              }

              buildTypes {
                  debug {}
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              kapt("androidx.room:room-compiler:2.6.1")
              implementation("com.squareup.retrofit2:retrofit:2.9.0")
              implementation("com.squareup.retrofit2:converter-gson:2.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
              implementation("androidx.datastore:datastore-preferences:1.0.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("com.google.code.gson:gson:2.10.1")
              implementation("androidx.compose.material:material:1.6.1")
          }
          EOF

          touch app/proguard-rules.pro

          # ========== ANDROIDMANIFEST ==========
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="LunarVeil"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LunarVeil"
                  tools:targetApi="34">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.LunarVeil">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.LunarVeil" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          # ========== ICONS ==========
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@color/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@color/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/values/ic_launcher_colors.xml << 'EOF'
          <resources>
              <color name="ic_launcher_background">#6750A4</color>
              <color name="ic_launcher_foreground">#FFFFFF</color>
          </resources>
          EOF

          # ========== THEME ==========
          cat > app/src/main/java/me/lunarveil/ui/theme/Theme.kt << 'EOF'
          package me.lunarveil.ui.theme

          import android.app.Activity
          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.SideEffect
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalView
          import androidx.core.view.WindowCompat

          @Composable
          fun LunarVeilTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              dynamicColor: Boolean = true,
              content: @Composable () -> Unit
          ) {
              val colorScheme = when {
                  dynamicColor && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S -> {
                      val c = LocalContext.current
                      if (darkTheme) dynamicDarkColorScheme(c) else dynamicLightColorScheme(c)
                  }
                  darkTheme -> darkColorScheme(
                      primary = Color(0xFFD0BCFF),
                      secondary = Color(0xFFCCC2DC),
                      tertiary = Color(0xFFEFB8C8),
                      surface = Color(0xFF1C1B1F),
                      background = Color(0xFF1C1B1F)
                  )
                  else -> lightColorScheme(
                      primary = Color(0xFF6750A4),
                      secondary = Color(0xFF625B71),
                      tertiary = Color(0xFF7D5260),
                      surface = Color(0xFFFFFBFE),
                      background = Color(0xFFFFFBFE)
                  )
              }

              val view = LocalView.current
              if (!view.isInEditMode) {
                  SideEffect {
                      val window = (view.context as Activity).window
                      window.statusBarColor = colorScheme.surface.toArgb()
                      WindowCompat.getInsetsController(window, view).isAppearanceLightStatusBars = !darkTheme
                  }
              }

              MaterialTheme(
                  colorScheme = colorScheme,
                  content = content
              )
          }
          EOF

          # ========== MODELS ==========
          cat > app/src/main/java/me/lunarveil/data/model/Models.kt << 'EOF'
          package ruqueue;package me.lunarveil.data.model

          import androidx.room.Entity
          import androidx.room.PrimaryKey

          @Entity(tableName = "chats")
          data class Chat(
              @PrimaryKey val id: Long,
              val name: String,
              val type: String,
              val unread: Int,
              val lastMsg: String,
              val lastDate: String?,
              val archived: Boolean,
              val username: String? = null,
              val phone: String? = null,
              val lastMedia: String? = null
          )

          @Entity(tableName = "messages")
          data class Message(
              @PrimaryKey val id: Long,
              val chatId: Long,
              val date: String?,
              val text: String,
              val out: Boolean,
              val sender: String,
              val media: String? = null,
              val fileId: String? = null,
              val fileName: String? = null,
              val fileSize: Long? = null,
              val fileMime: String? = null
          )

          data class GitHubContent(
              val content: String?,
              val encoding: String?,
              val sha: String?,
              val size: Int?
          )

          data class TriggerBody(val ref: String = "main", val inputs: TriggerInputs)
          data class TriggerInputs(val actions_json: String)
          EOF

          # ========== ROOM DATABASE ==========
          cat > app/src/main/java/me/lunarveil/data/local/AppDatabase.kt << 'EOF'
          package me.lunarveil.data.local

          import androidx.room.*
          import me.lunarveil.data.model.Chat
          import me.lunarveil.data.model.Message

          @Database(entities = [Chat::class, Message::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun chatDao(): ChatDao
              abstract fun messageDao(): MessageDao
          }

          @Dao
          interface ChatDao {
              @Query("SELECT * FROM chats ORDER BY lastDate DESC")
              suspend fun getAll(): List<Chat>
              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertAll(chats: List<Chat>)
              @Query("DELETE FROM chats")
              suspend fun deleteAll()
          }

          @Dao
          interface MessageDao {
              @Query("SELECT * FROM messages WHERE chatId = :chatId ORDER BY id DESC")
              suspend fun getByChat(chatId: Long): List<Message>
              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertAll(messages: List<Message>)
          }
          EOF

          # ========== PREFERENCES ==========
          cat > app/src/main/java/me/lunarveil/data/local/AppPreferences.kt << 'EOF'
          package me.lunarveil.data.local

          import android.content.Context
          import androidx.datastore.core.DataStore
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map

          private val Context.dataStore: DataStore<Preferences> by preferencesDataStore(name = "lunarveil")

          class AppPreferences(private val context: Context) {
              companion object {
                  val KEY_TOKEN = stringPreferencesKey("token")
                  val KEY_OWNER = stringPreferencesKey("owner")
                  val KEY_REPO = stringPreferencesKey("repo")
                  val KEY_SETUP = booleanPreferencesKey("setup_done")
              }

              val token: Flow<String> = context.dataStore.data.map { it[KEY_TOKEN] ?: "" }
              val owner: Flow<String> = context.dataStore.data.map { it[KEY_OWNER] ?: "" }
              val repo: Flow<String> = context.dataStore.data.map { it[KEY_REPO] ?: "" }
              val isSetupDone: Flow<Boolean> = context.dataStore.data.map { it[KEY_SETUP] ?: false }

              suspend fun saveCredentials(t: String, o: String, r: String) {
                  context.dataStore.edit {
                      it[KEY_TOKEN] = t; it[KEY_OWNER] = o; it[KEY_REPO] = r; it[KEY_SETUP] = true
                  }
              }
          }
          EOF

          # ========== GITHUB API ==========
          cat > app/src/main/java/me/lunarveil/data/remote/GitHubApi.kt << 'EOF'
          package me.lunarveil.data.remote

          import me.lunarveil.data.model.GitHubContent
          import retrofit2.Response
          import retrofit2.http.*

          interface GitHubApi {
              @POST("repos/{owner}/{repo}/actions/workflows/telegram.yml/dispatches")
              suspend fun triggerWorkflow(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Body body: TriggerBody,
                  @Header("Authorization") auth: String
              ): Response<Unit>

              @GET("repos/{owner}/{repo}/contents/telegram_data/chats.json")
              suspend fun getChats(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Header("Authorization") auth: String
              ): GitHubContent

              @GET("repos/{owner}/{repo}/contents/telegram_data/chat_{chatId}.json")
              suspend fun getMessages(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Path("chatId") chatId: Long,
                  @Header("Authorization") auth: String
              ): GitHubContent

              @GET("repos/{owner}/{repo}/contents/telegram_data/last_update.json")
              suspend fun getLastUpdate(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Header("Authorization") auth: String
              ): GitHubContent
          }

          data class TriggerBody(val ref: String = "main", val inputs: TriggerInputs)
          data class TriggerInputs(val actions_json: String)
          EOF

          # ========== REPOSITORY ==========
          cat > app/src/main/java/me/lunarveil/data/repository/TelegramRepository.kt << 'EOF'
          package io.dequeue;package me.lunarveil.data.repository

          import android.util.Base64
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import me.lunarveil.data.local.AppDatabase
          import me.lunarveil.data.model.Chat
          import me.lunarveil.data.model.Message
          import me.lunarveil.data.remote.GitHubApi
          import me.lunarveil.data.remote.TriggerBody
          import me.lunarveil.data.remote.TriggerInputs

          class TelegramRepository(
              private val api: GitHubApi,
              private val db: AppDatabase,
              private val gson: Gson
          ) {
              suspend fun getChats(token: String, owner: String, repo: String): List<Chat> {
                  val auth = "Bearer $token"
                  val content = api.getChats(owner, repo, auth)
                  val json = decodeContent(content.content)
                  val chats: List<Chat> = gson.fromJson(json, object : TypeToken<List<Chat>>() {}.type)
                  db.chatDao().deleteAll()
                  db.chatDao().insertAll(chats)
                  return chats
              }

              suspend fun getMessages(token: String, owner: String, repo: String, chatId: Long): List<Message> {
                  val auth = "Bearer $token"
                  val content = api.getMessages(owner, repo, chatId, auth)
                  val json = decodeContent(content.content)
                  val msgs: List<Message> = gson.fromJson(json, object : TypeToken<List<Message>>() {}.type)
                  msgs.forEach { it.chatId = chatId }
                  db.messageDao().insertAll(msgs)
                  return msgs
              }

              suspend fun getCachedChats(): List<Chat> = db.chatDao().getAll()
              suspend fun getCachedMessages(chatId: Long): List<Message> = db.messageDao().getByChat(chatId)

              suspend fun triggerWorkflow(token: String, owner: String, repo: String, actions: String) {
                  val auth = "Bearer $token"
                  api.triggerWorkflow(owner, repo, TriggerBody(inputs = TriggerInputs(actions)), auth)
              }

              private fun decodeContent(content: String?): String {
                  if (content == null) return "[]"
                  return try {
                      String(Base64.decode(content.replace("\n", ""), Base64.DEFAULT))
                  } catch (e: Exception) {
                      "[]"
                  }
              }
          }
          EOF

          # ========== VIEWMODEL ==========
          cat > app/src/main/java/me/lunarveil/viewmodel/MainViewModel.kt << 'EOF'
          package me.lunarveil.viewmodel

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.room.Room
          import com.google.gson.Gson
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          import me.lunarveil.data.local.AppDatabase
          import me.lunarveil.data.local.AppPreferences
          import me.lunarveil.data.model.Chat
          import me.lunarveil.data.model.Message
          import me.lunarveil.data.remote.GitHubApi
          import me.lunarveil.data.repository.TelegramRepository
          import okhttp3.OkHttpClient
          import retrofit2.Retrofit
          import retrofit2.converter.gson.GsonConverterFactory
          import java.util.concurrent.TimeUnit

          class MainViewModel(application: Application) : AndroidViewModel(application) {
              private val prefs = AppPreferences(application)
              private val db = Room.databaseBuilder(application, AppDatabase::class.java, "lunarveil").build()
              private val client = OkHttpClient.Builder().connectTimeout(30, TimeUnit.SECONDS).readTimeout(30, TimeUnit.SECONDS).build()
              private val retrofit = Retrofit.Builder().baseUrl("https://api.github.com/").client(client).addConverterFactory(GsonConverterFactory.create()).build()
              private val api = retrofit.create(GitHubApi::class.java)
              private val repo = TelegramRepository(api, db, Gson())

              val token: StateFlow<String> = prefs.token.stateIn(viewModelScope, SharingStarted.Eagerly, "")
              val owner: StateFlow<String> = prefs.owner.stateIn(viewModelScope, SharingStarted.Eagerly, "")
              val repoName: StateFlow<String> = prefs.repo.stateIn(viewModelScope, SharingStarted.Eagerly, "")
              val isSetupDone: StateFlow<Boolean> = prefs.isSetupDone.stateIn(viewModelScope, SharingStarted.Eagerly, false)

              private val _chats = MutableStateFlow<List<Chat>>(emptyList())
              val chats: StateFlow<List<Chat>> = _chats

              private val _messages = MutableStateFlow<List<Message>>(emptyList())
              val messages: StateFlow<List<Message>> = _messages

              private val _isLoading = MutableStateFlow(false)
              val isLoading: StateFlow<Boolean> = _isLoading

              private val _status = MutableStateFlow("Ready")
              val status: StateFlow<String> = _status

              fun setupDone(token: String, owner: String, repo: String) {
                  viewModelScope.launch { prefs.saveCredentials(token, owner, repo) }
              }

              fun fetchChats() {
                  viewModelScope.launch {
                      _isLoading.value = true
                      _status.value = "Fetching chats..."
                      try {
                          val c = repo.getChats(token.value, owner.value, repoName.value)
                          _chats.value = c
                          _status.value = "${c.size} chats loaded"
                      } catch (e: Exception) {
                          _status.value = "Error: ${e.message}"
                          _chats.value = repo.getCachedChats()
                      }
                      _isLoading.value = false
                  }
              }

              fun fetchMessages(chatId: Long) {
                  viewModelScope.launch {
                      _isLoading.value = true
                      _status.value = "Fetching messages..."
                      try {
                          val m = repo.getMessages(token.value, owner.value, repoName.value, chatId)
                          _messages.value = m
                          _status.value = "${m.size} messages loaded"
                      } catch (e: Exception) {
                          _status.value = "Error: ${e.message}"
                          _messages.value = repo.getCachedMessages(chatId)
                      }
                      _isLoading.value = false
                  }
              }

              fun triggerWorkflow(actionsJson: String) {
                  viewModelScope.launch {
                      _status.value = "Triggering workflow..."
                      try {
                          repo.triggerWorkflow(token.value, owner.value, repoName.value, actionsJson)
                          _status.value = "Workflow triggered! Wait ~30s then fetch."
                      } catch (e: Exception) {
                          _status.value = "Trigger error: ${e.message}"
                      }
                  }
              }
          }
          EOF

          # ========== SCREENS ==========
          cat > app/src/main/java/me/lunarveil/ui/screens/SetupScreen.kt << 'EOF'
