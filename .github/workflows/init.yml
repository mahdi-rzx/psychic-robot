name: Build & Release LunarVeil APK (Pure Kotlin)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Max size per split file (MB)'
        default: '90'
        required: false
      clean_old_builds:
        description: 'Delete all previous builds'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '90' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || (git commit -m "Clean old builds" && git push)
          git pull

      - name: Generate fresh project files
        run: |
          # Remove everything old
          rm -rf app/src/main/java
          rm -rf gradle/wrapper
          mkdir -p app/src/main/java/me/lunarveil/ui/theme
          mkdir -p app/src/main/java/me/lunarveil/ui/screens
          mkdir -p app/src/main/java/me/lunarveil/data/local
          mkdir -p app/src/main/java/me/lunarveil/data/remote
          mkdir -p app/src/main/java/me/lunarveil/data/model
          mkdir -p app/src/main/java/me/lunarveil/data/repository
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          # ---------- Gradle files ----------
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LunarVeil"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "me.lunarveil"
              compileSdk = 34

              defaultConfig {
                  applicationId = "me.lunarveil"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = System.getenv("VERSION") ?: "1.0.0"
              }

              buildTypes {
                  debug {}
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("com.squareup.retrofit2:retrofit:2.9.0")
              implementation("com.squareup.retrofit2:converter-gson:2.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.datastore:datastore-preferences:1.0.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          touch app/proguard-rules.pro

          # ---------- Resources ----------
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="LunarVeil"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LunarVeil">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.LunarVeil">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.LunarVeil" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@color/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@color/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/values/ic_launcher_colors.xml << 'EOF'
          <resources>
              <color name="ic_launcher_background">#6750A4</color>
              <color name="ic_launcher_foreground">#FFFFFF</color>
          </resources>
          EOF

          # ---------- Kotlin sources ----------
          # Theme
          cat > app/src/main/java/me/lunarveil/ui/theme/Theme.kt << 'EOF'
          package me.lunarveil.ui.theme

          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext

          @Composable
          fun LunarVeilTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              dynamicColor: Boolean = true,
              content: @Composable () -> Unit
          ) {
              val colorScheme = when {
                  dynamicColor && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S -> {
                      val context = LocalContext.current
                      if (darkTheme) dynamicDarkColorScheme(context)
                      else dynamicLightColorScheme(context)
                  }
                  darkTheme -> darkColorScheme(
                      primary = Color(0xFFD0BCFF),
                      secondary = Color(0xFFCCC2DC),
                      tertiary = Color(0xFFEFB8C8),
                      background = Color(0xFF1C1B1F),
                      surface = Color(0xFF1C1B1F)
                  )
                  else -> lightColorScheme(
                      primary = Color(0xFF6750A4),
                      secondary = Color(0xFF625B71),
                      tertiary = Color(0xFF7D5260),
                      background = Color(0xFFFFFBFE),
                      surface = Color(0xFFFFFBFE)
                  )
              }
              MaterialTheme(colorScheme = colorScheme, content = content)
          }
          EOF

          # Models
          cat > app/src/main/java/me/lunarveil/data/model/Models.kt << 'EOF'
          package me.lunarveil.data.model

          data class Chat(
              val id: Long,
              val name: String,
              val type: String,
              val unread: Int = 0,
              val lastMsg: String = "",
              val lastDate: String? = null,
              val archived: Boolean = false,
              val username: String? = null,
              val phone: String? = null,
              val lastMedia: String? = null
          )

          data class Message(
              val id: Long,
              val date: String? = null,
              val text: String = "",
              val out: Boolean = false,
              val sender: String = "",
              val media: String? = null
          )
          EOF

          # GitHub API interface
          cat > app/src/main/java/me/lunarveil/data/remote/GitHubApi.kt << 'EOF'
          package me.lunarveil.data.remote

          import retrofit2.Response
          import retrofit2.http.*

          interface GitHubApi {
              @POST("repos/{owner}/{repo}/actions/workflows/telegram.yml/dispatches")
              suspend fun triggerWorkflow(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Body body: TriggerBody,
                  @Header("Authorization") auth: String
              ): Response<Unit>

              @GET("repos/{owner}/{repo}/contents/telegram_data/chats.json")
              suspend fun getChats(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Header("Authorization") auth: String
              ): GitHubContent

              @GET("repos/{owner}/{repo}/contents/telegram_data/chat_{chatId}.json")
              suspend fun getMessages(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Path("chatId") chatId: Long,
                  @Header("Authorization") auth: String
              ): GitHubContent

              @GET("repos/{owner}/{repo}/contents/telegram_data/last_update.json")
              suspend fun getLastUpdate(
                  @Path("owner") owner: String,
                  @Path("repo") repo: String,
                  @Header("Authorization") auth: String
              ): GitHubContent
          }

          data class TriggerBody(val ref: String = "main", val inputs: TriggerInputs)
          data class TriggerInputs(val actions_json: String)
          data class GitHubContent(val content: String?, val encoding: String?)
          EOF

          # Retrofit client
          cat > app/src/main/java/me/lunarveil/data/remote/RetrofitClient.kt << 'EOF'
          package me.lunarveil.data.remote

          import okhttp3.OkHttpClient
          import retrofit2.Retrofit
          import retrofit2.converter.gson.GsonConverterFactory
          import java.util.concurrent.TimeUnit

          object RetrofitClient {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(30, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS)
                  .build()

              private val retrofit = Retrofit.Builder()
                  .baseUrl("https://api.github.com/")
                  .client(client)
                  .addConverterFactory(GsonConverterFactory.create())
                  .build()

              val api: GitHubApi = retrofit.create(GitHubApi::class.java)
          }
          EOF

          # Repository
          cat > app/src/main/java/me/lunarveil/data/repository/TelegramRepository.kt << 'EOF'
          package me.lunarveil.data.repository

          import android.util.Base64
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import me.lunarveil.data.model.Chat
          import me.lunarveil.data.model.Message
          import me.lunarveil.data.remote.GitHubApi
          import me.lunarveil.data.remote.TriggerBody
          import me.lunarveil.data.remote.TriggerInputs

          class TelegramRepository(
              private val api: GitHubApi,
              private val token: String,
              private val owner: String,
              private val repo: String
          ) {
              private val gson = Gson()
              private val authHeader = "Bearer $token"

              suspend fun triggerWorkflow(actionsJson: String): Boolean {
                  return try {
                      val response = api.triggerWorkflow(
                          owner, repo,
                          TriggerBody(inputs = TriggerInputs(actionsJson)),
                          authHeader
                      )
                      response.isSuccessful
                  } catch (e: Exception) {
                      false
                  }
              }

              suspend fun getChats(): List<Chat> {
                  return try {
                      val content = api.getChats(owner, repo, authHeader)
                      val json = decodeContent(content.content)
                      gson.fromJson(json, object : TypeToken<List<Chat>>() {}.type) ?: emptyList()
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              suspend fun getMessages(chatId: Long): List<Message> {
                  return try {
                      val content = api.getMessages(owner, repo, chatId, authHeader)
                      val json = decodeContent(content.content)
                      gson.fromJson(json, object : TypeToken<List<Message>>() {}.type) ?: emptyList()
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              suspend fun getLastUpdateTimestamp(): String? {
                  return try {
                      val content = api.getLastUpdate(owner, repo, authHeader)
                      val json = decodeContent(content.content)
                      gson.fromJson(json, Map::class.java)?.get("timestamp") as? String
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun decodeContent(content: String?): String {
                  if (content.isNullOrBlank()) return ""
                  return try {
                      String(Base64.decode(content.replace("\n", ""), Base64.DEFAULT))
                  } catch (e: Exception) {
                      ""
                  }
              }
          }
          EOF

          # DataStore preferences
          cat > app/src/main/java/me/lunarveil/data/local/AppPreferences.kt << 'EOF'
          package io.require;package me.lunarveil.data.local

          import android.content.Context
          import androidx.datastore.core.DataStore
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map

          private val Context.dataStore: DataStore<Preferences> by preferencesDataStore(name = "lunarveil")

          class AppPreferences(private val context: Context) {
              companion object {
                  private val KEY_TOKEN = stringPreferencesKey("token")
                  private val KEY_OWNER = stringPreferencesKey("owner")
                  private val KEY_REPO = stringPreferencesKey("repo")
                  private val KEY_OTP = stringPreferencesKey("otp")
                  private val KEY_SETUP = booleanPreferencesKey("setup")
              }

              val token: Flow<String> = context.dataStore.data.map { it[KEY_TOKEN] ?: "" }
              val owner: Flow<String> = context.dataStore.data.map { it[KEY_OWNER] ?: "" }
              val repo: Flow<String> = context.dataStore.data.map { it[KEY_REPO] ?: "" }
              val otp: Flow<String> = context.dataStore.data.map { it[KEY_OTP] ?: "" }
              val isSetup: Flow<Boolean> = context.dataStore.data.map { it[KEY_SETUP] ?: false }

              suspend fun saveCredentials(token: String, owner: String, repo: String, otp: String) {
                  context.dataStore.edit {
                      it[KEY_TOKEN] = token
                      it[KEY_OWNER] = owner
                      it[KEY_REPO] = repo
                      it[KEY_OTP] = otp
                      it[KEY_SETUP] = true
                  }
              }
          }
          EOF

          # Logger
          cat > app/src/main/java/me/lunarveil/ui/screens/Logger.kt << 'EOF'
          package me.lunarveil.ui.screens

          import androidx.compose.runtime.mutableStateListOf

          object Logger {
              val logs = mutableStateListOf<String>()

              fun i(tag: String, msg: String) {
                  logs.add("[INFO][$tag] $msg")
              }

              fun e(tag: String, msg: String) {
                  logs.add("[ERROR][$tag] $msg")
              }
          }
          EOF

          # MainActivity (ALL UI)
          cat > app/src/main/java/me/lunarveil/MainActivity.kt << 'MAINEOF'
          package me.lunarveil

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material.icons.outlined.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.navigation.NavDestination.Companion.hierarchy
          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.compose.*
          import com.google.gson.Gson
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.runBlocking
          import me.lunarveil.BuildConfig
          import me.lunarveil.data.local.AppPreferences
          import me.lunarveil.data.model.Chat
          import me.lunarveil.data.model.Message
          import me.lunarveil.data.remote.RetrofitClient
          import me.lunarveil.data.repository.TelegramRepository
          import me.lunarveil.ui.screens.Logger
          import me.lunarveil.ui.theme.LunarVeilTheme

          class MainActivity : ComponentActivity() {
              private val prefs by lazy { AppPreferences(this) }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val setupDone = runBlocking { prefs.isSetup.first() }
                  val savedOtp = runBlocking { prefs.otp.first() }

                  setContent {
                      LunarVeilTheme {
                          var showSetup by remember { mutableStateOf(!setupDone) }
                          var showLock by remember { mutableStateOf(setupDone) }
                          var otp by remember { mutableStateOf(savedOtp) }

                          if (showSetup) {
                              SetupScreen { token, owner, repo, newOtp ->
                                  runBlocking {
                                      prefs.saveCredentials(token, owner, repo, newOtp)
                                      otp = newOtp
                                  }
                                  showSetup = false
                                  showLock = false
                              }
                          } else if (showLock) {
                              LockScreen(expectedOtp = otp) {
                                  showLock = false
                              }
                          } else {
                              MainApp(prefs)
                          }
                      }
                  }
              }
          }

          @Composable
          fun SetupScreen(onComplete: (String, String, String, String) -> Unit) {
              var token by remember { mutableStateOf("") }
              var owner by remember { mutableStateOf("") }
              var repo by remember { mutableStateOf("") }
              var otp by remember { mutableStateOf("") }

              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(32.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text(text = "🌙 Welcome to LunarVeil", style = MaterialTheme.typography.headlineMedium)
                      Spacer(modifier = Modifier.height(24.dp))
                      OutlinedTextField(
                          value = token,
                          onValueChange = { token = it },
                          label = { Text("GitHub Token") },
                          visualTransformation = PasswordVisualTransformation(),
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(modifier = Modifier.height(8.dp))
                      OutlinedTextField(
                          value = owner,
                          onValueChange = { owner = it },
                          label = { Text("Repo Owner") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(modifier = Modifier.height(8.dp))
                      OutlinedTextField(
                          value = repo,
                          onValueChange = { repo = it },
                          label = { Text("Repo Name") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(modifier = Modifier.height(8.dp))
                      OutlinedTextField(
                          value = otp,
                          onValueChange = { otp = it },
                          label = { Text("Set App Password") },
                          visualTransformation = PasswordVisualTransformation(),
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(modifier = Modifier.height(24.dp))
                      Button(
                          onClick = { onComplete(token, owner, repo, otp) },
                          enabled = token.isNotBlank() && owner.isNotBlank() && repo.isNotBlank() && otp.isNotBlank(),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Save & Continue")
                      }
                  }
              }
          }

          @Composable
          fun LockScreen(expectedOtp: String, onUnlock: () -> Unit) {
              var otp by remember { mutableStateOf("") }
              var error by remember { mutableStateOf(false) }

              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(32.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text(text = "🔒 LunarVeil", style = MaterialTheme.typography.headlineMedium)
                      Spacer(modifier = Modifier.height(24.dp))
                      OutlinedTextField(
                          value = otp,
                          onValueChange = { otp = it; error = false },
                          label = { Text("Password") },
                          visualTransformation = PasswordVisualTransformation(),
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password),
                          singleLine = true,
                          isError = error,
                          modifier = Modifier.fillMaxWidth()
                      )
                      if (error) {
                          Text(
                              text = "Wrong password",
                              color = MaterialTheme.colorScheme.error,
                              style = MaterialTheme.typography.bodySmall
                          )
                      }
                      Spacer(modifier = Modifier.height(24.dp))
                      Button(
                          onClick = { if (otp == expectedOtp) onUnlock() else error = true },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Unlock")
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainApp(prefs: AppPreferences) {
              val navController = rememberNavController()
              val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)
              val scope = rememberCoroutineScope()
              var chats by remember { mutableStateOf<List<Chat>>(emptyList()) }
              var messages by remember { mutableStateOf<List<Message>>(emptyList()) }
              var isLoading by remember { mutableStateOf(false) }
              var currentChatId by remember { mutableStateOf<Long?>(null) }
              var currentChatName by remember { mutableStateOf("") }
              var repository by remember { mutableStateOf<TelegramRepository?>(null) }
              val snackbarHostState = remember { SnackbarHostState() }

              // Initialize repository from stored credentials
              LaunchedEffect(Unit) {
                  val token = prefs.token.first()
                  val owner = prefs.owner.first()
                  val repo = prefs.repo.first()
                  if (token.isNotBlank() && owner.isNotBlank() && repo.isNotBlank()) {
                      repository = TelegramRepository(RetrofitClient.api, token, owner, repo)
                      Logger.i("Main", "Repository ready: $owner/$repo")
                      isLoading = true
                      val loadedChats = repository?.getChats() ?: emptyList()
                      chats = loadedChats
                      isLoading = false
                      Logger.i("Main", "Loaded ${loadedChats.size} chats")
                  }
              }

              val screens = listOf(
                  Triple("Chats", Icons.Outlined.Chat, Icons.Filled.Chat),
                  Triple("Logs", Icons.Outlined.List, Icons.Filled.List),
                  Triple("About", Icons.Outlined.Info, Icons.Filled.Info)
              )
              val navBackStackEntry by navController.currentBackStackEntryAsState()
              val currentDestination = navBackStackEntry?.destination
              val isDetailScreen = currentDestination?.route in listOf("detail", "settings")

              ModalNavigationDrawer(
                  drawerState = drawerState,
                  gesturesEnabled = !isDetailScreen,
                  drawerContent = {
                      ModalDrawerSheet {
                          Spacer(modifier = Modifier.height(16.dp))
                          Text(
                              text = "LunarVeil",
                              modifier = Modifier.padding(16.dp),
                              style = MaterialTheme.typography.headlineSmall
                          )
                          HorizontalDivider()
                          NavigationDrawerItem(
                              icon = { Text(text = "▶") },
                              label = { Text(text = "Run Workflow") },
                              selected = false,
                              onClick = {
                                  scope.launch {
                                      drawerState.close()
                                      repository?.triggerWorkflow(
                                          Gson().toJson(listOf(mapOf("type" to "get_chats")))
                                      )
                                      snackbarHostState.showSnackbar("Workflow triggered! Wait ~30s then Fetch.")
                                  }
                              }
                          )
                          NavigationDrawerItem(
                              icon = { Text(text = "⬇") },
                              label = { Text(text = "Fetch Results") },
                              selected = false,
                              onClick = {
                                  scope.launch {
                                      drawerState.close()
                                      isLoading = true
                                      val fresh = repository?.getChats() ?: emptyList()
                                      chats = fresh
                                      isLoading = false
                                      snackbarHostState.showSnackbar("Fetched ${fresh.size} chats")
                                  }
                              }
                          )
                          HorizontalDivider()
                          NavigationDrawerItem(
                              icon = { Text(text = "⚙") },
                              label = { Text(text = "Settings") },
                              selected = false,
                              onClick = {
                                  scope.launch { drawerState.close() }
                                  navController.navigate("settings")
                              }
                          )
                      }
                  }
              ) {
                  Scaffold(
                      snackbarHost = { SnackbarHost(hostState = snackbarHostState) },
                      topBar = {
                          if (!isDetailScreen) {
                              TopAppBar(
                                  title = { Text(text = "LunarVeil") },
                                  navigationIcon = {
                                      IconButton(onClick = { scope.launch { drawerState.open() } }) {
                                          Icon(
                                              imageVector = Icons.Default.Menu,
                                              contentDescription = "Menu"
                                          )
                                      }
                                  },
                                  colors = TopAppBarDefaults.topAppBarColors(
                                      containerColor = MaterialTheme.colorScheme.surface
                                  )
                              )
                          }
                      },
                      bottomBar = {
                          if (!isDetailScreen) {
                              NavigationBar {
                                  screens.forEachIndexed { index, (title, icon, selectedIcon) ->
                                      val selected = currentDestination?.hierarchy?.any { it.route == "screen_$index" } == true
                                      NavigationBarItem(
                                          icon = {
                                              Icon(
                                                  imageVector = if (selected) selectedIcon else icon,
                                                  contentDescription = title
                                              )
                                          },
                                          label = { Text(text = title) },
                                          selected = selected,
                                          onClick = {
                                              navController.navigate("screen_$index") {
                                                  popUpTo(navController.graph.findStartDestination().id) {
                                                      saveState = true
                                                  }
                                                  launchSingleTop = true
                                                  restoreState = true
                                              }
                                          }
                                      )
                                  }
                              }
                          }
                      }
                  ) { innerPadding ->
                      NavHost(
                          navController = navController,
                          startDestination = "screen_0",
                          modifier = Modifier.padding(innerPadding)
                      ) {
                          // Chat list (Telegram tab)
                          composable("screen_0") {
                              if (isLoading) {
                                  Box(
                                      modifier = Modifier.fillMaxSize(),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      CircularProgressIndicator()
                                  }
                              } else if (chats.isEmpty()) {
                                  Box(
                                      modifier = Modifier.fillMaxSize(),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(
                                          text = "No chats. Use menu to fetch.",
                                          color = MaterialTheme.colorScheme.onSurfaceVariant
                                      )
                                  }
                              } else {
                                  val mainChats = chats.filter { !it.archived }
                                  val archivedChats = chats.filter { it.archived }
                                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                                      items(items = mainChats) { chat ->
                                          ChatRow(chat = chat) {
                                              currentChatId = chat.id
                                              currentChatName = chat.name
                                              scope.launch {
                                                  messages = repository?.getMessages(chat.id) ?: emptyList()
                                                  navController.navigate("detail")
                                              }
                                          }
                                      }
                                      if (archivedChats.isNotEmpty()) {
                                          item {
                                              Text(
                                                  text = "📦 Archived",
                                                  modifier = Modifier.padding(12.dp),
                                                  style = MaterialTheme.typography.labelMedium,
                                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                                              )
                                          }
                                          items(items = archivedChats) { chat ->
                                              ChatRow(chat = chat) {
                                                  currentChatId = chat.id
                                                  currentChatName = chat.name
                                                  scope.launch {
                                                      messages = repository?.getMessages(chat.id) ?: emptyList()
                                                      navController.navigate("detail")
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }

                          // Chat detail
                          composable("detail") {
                              ChatDetailScreen(
                                  chatName = currentChatName,
                                  messages = messages,
                                  onBack = { navController.popBackStack() },
                                  onSend = { text ->
                                      scope.launch {
                                          repository?.triggerWorkflow(
                                              Gson().toJson(
                                                  listOf(
                                                      mapOf(
                                                          "type" to "send_message",
                                                          "chat_id" to currentChatId,
                                                          "text" to text
                                                      ),
                                                      mapOf(
                                                          "type" to "get_messages",
                                                          "chat_id" to currentChatId,
                                                          "limit" to 50
                                                      )
                                                  )
                                              )
                                          )
                                          snackbarHostState.showSnackbar("Message queued!")
                                      }
                                  }
                              )
                          }

                          // Settings
                          composable("settings") {
                              val token = runBlocking { prefs.token.first() }
                              val owner = runBlocking { prefs.owner.first() }
                              val repo = runBlocking { prefs.repo.first() }
                              SettingsScreen(
                                  token = token,
                                  owner = owner,
                                  repo = repo,
                                  onBack = { navController.popBackStack() }
                              )
                          }

                          // Logs tab
                          composable("screen_1") {
                              LogsScreen()
                          }

                          // About tab
                          composable("screen_2") {
                              AboutScreen(version = BuildConfig.VERSION_NAME)
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChatRow(chat: Chat, onClick: () -> Unit) {
              Surface(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable(onClick = onClick),
                  color = MaterialTheme.colorScheme.surface
              ) {
                  Row(
                      modifier = Modifier.padding(12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Surface(
                          modifier = Modifier.size(48.dp),
                          shape = MaterialTheme.shapes.extraLarge,
                          color = MaterialTheme.colorScheme.primaryContainer
                      ) {
                          Box(contentAlignment = Alignment.Center) {
                              Text(
                                  text = chat.name.take(1).uppercase(),
                                  color = MaterialTheme.colorScheme.onPrimaryContainer
                              )
                          }
                      }
                      Spacer(modifier = Modifier.width(12.dp))
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              text = chat.name,
                              style = MaterialTheme.typography.bodyLarge,
                              fontWeight = FontWeight.Medium,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          Text(
                              text = chat.lastMsg.ifEmpty {
                                  if (chat.lastMedia != null) "📎 Media" else ""
                              },
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      if (chat.unread > 0) {
                          Surface(
                              shape = MaterialTheme.shapes.small,
                              color = MaterialTheme.colorScheme.primary
                          ) {
                              Text(
                                  text = "${chat.unread}",
                                  modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp),
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.onPrimary
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChatDetailScreen(
              chatName: String,
              messages: List<Message>,
              onBack: () -> Unit,
              onSend: (String) -> Unit
          ) {
              var inputText by remember { mutableStateOf("") }
              val listState = rememberLazyListState()

              LaunchedEffect(messages.size) {
                  if (messages.isNotEmpty()) {
                      listState.animateScrollToItem(0)
                  }
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      TextButton(onClick = onBack) {
                          Text(text = "←")
                      }
                      Text(
                          text = chatName,
                          style = MaterialTheme.typography.titleMedium,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
                  HorizontalDivider()
                  LazyColumn(
                      state = listState,
                      modifier = Modifier
                          .weight(1f)
                          .padding(horizontal = 8.dp),
                      reverseLayout = true
                  ) {
                      items(items = messages.reversed()) { msg ->
                          val isSent = msg.out
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 2.dp),
                              horizontalAlignment = if (isSent) Alignment.End else Alignment.Start
                          ) {
                              Surface(
                                  shape = MaterialTheme.shapes.medium,
                                  color = if (isSent)
                                      MaterialTheme.colorScheme.primaryContainer
                                  else
                                      MaterialTheme.colorScheme.surfaceVariant,
                                  modifier = Modifier.widthIn(max = 280.dp)
                              ) {
                                  Column(modifier = Modifier.padding(8.dp)) {
                                      if (!isSent && msg.sender.isNotBlank()) {
                                          Text(
                                              text = msg.sender,
                                              style = MaterialTheme.typography.labelSmall,
                                              color = MaterialTheme.colorScheme.primary
                                          )
                                      }
                                      if (msg.text.isNotBlank()) {
                                          Text(
                                              text = msg.text,
                                              style = MaterialTheme.typography.bodyMedium
                                          )
                                      }
                                      if (!msg.media.isNullOrEmpty()) {
                                          Text(
                                              text = "📎 ${msg.media}",
                                              style = MaterialTheme.typography.bodySmall,
                                              color = MaterialTheme.colorScheme.onSurfaceVariant
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
                  HorizontalDivider()
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      OutlinedTextField(
                          value = inputText,
                          onValueChange = { inputText = it },
                          modifier = Modifier.weight(1f),
                          placeholder = { Text(text = "Message...") },
                          singleLine = true
                      )
                      Spacer(modifier = Modifier.width(8.dp))
                      Button(onClick = {
                          if (inputText.isNotBlank()) {
                              onSend(inputText)
                              inputText = ""
                          }
                      }) {
                          Text(text = "Send")
                      }
                  }
              }
          }

          @Composable
          fun LogsScreen() {
              val listState = rememberLazyListState()
              val scope = rememberCoroutineScope()

              LaunchedEffect(Logger.logs.size) {
                  if (Logger.logs.isNotEmpty()) {
                      scope.launch { listState.animateScrollToItem(Logger.logs.size - 1) }
                  }
              }

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(8.dp),
                      horizontalArrangement = Arrangement.End
                  ) {
                      TextButton(onClick = { Logger.logs.clear() }) {
                          Text(text = "Clear")
                      }
                  }
                  LazyColumn(
                      state = listState,
                      modifier = Modifier.fillMaxSize()
                  ) {
                      items(items = Logger.logs.toList()) { log ->
                          Text(
                              text = log,
                              style = MaterialTheme.typography.bodySmall,
                              modifier = Modifier.padding(horizontal = 12.dp, vertical = 2.dp)
                          )
                      }
                  }
              }
          }

