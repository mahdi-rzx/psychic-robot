name: Build & Release LunarVeil APK (Split ZIP)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Max size per split file (MB)'
        default: '90'
        required: false
      clean_old_builds:
        description: 'Delete all previous builds'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '90' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds (if enabled)
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || (git commit -m "🧹 Clean old builds" && git push)
          git pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Create split ZIP (file.zip.001, file.zip.002, …)
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          APK_NAME="LunarVeil_v$VERSION.apk"
          BUILD_DIR="builds/$VERSION"
          mkdir -p "$BUILD_DIR"

          # Copy and rename APK
          cp "$APK_PATH" "$APK_NAME"

          # Zip the APK
          ZIP_NAME="LunarVeil_v$VERSION.zip"
          zip "$ZIP_NAME" "$APK_NAME"
          rm "$APK_NAME"

          # Split the ZIP into file.zip.001, file.zip.002, ...
          CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d --numeric-suffixes=1 -a 3 "$ZIP_NAME" "$BUILD_DIR/$ZIP_NAME."
          rm "$ZIP_NAME"

          # Create metadata
          TOTAL_SIZE=$(stat -c%s "$BUILD_DIR/$ZIP_NAME.001")  # size of first chunk
          NUM_CHUNKS=$(ls "$BUILD_DIR/$ZIP_NAME."* 2>/dev/null | wc -l)
          
          # Calculate total size across all chunks
          TOTAL_SIZE=0
          for f in "$BUILD_DIR/$ZIP_NAME."*; do
            TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$f")))
          done

          cat > "$BUILD_DIR/info.json" << INFO
          {
            "version": "$VERSION",
            "zip_name": "$ZIP_NAME",
            "total_size": $TOTAL_SIZE,
            "total_chunks": $NUM_CHUNKS,
            "chunk_size_mb": $CHUNK_SIZE_MB,
            "download_urls": [
          INFO

          for i in $(seq 1 $NUM_CHUNKS); do
            PADDED=$(printf "%03d" $i)
            echo "    \"https://raw.githubusercontent.com/${{ github.repository }}/main/$BUILD_DIR/${ZIP_NAME}.${PADDED}\"," >> "$BUILD_DIR/info.json"
          done

          sed -i '$ s/,$//' "$BUILD_DIR/info.json"
          echo '  ]' >> "$BUILD_DIR/info.json"
          echo '}' >> "$BUILD_DIR/info.json"

      - name: Commit split ZIP chunks
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds/
          git commit -m "🌙 LunarVeil v$VERSION – split ZIP" || echo "No changes"
          git push