name: Build & Release LunarVeil APK (Chunked ZIP)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Max size per ZIP chunk (MB)'
        default: '90'
        required: false
      clean_old_builds:
        description: 'Delete all previous builds'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '90' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds (if enabled)
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || (git commit -m "🧹 Clean old builds" && git push)
          git pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Create chunked ZIP files
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          BUILD_DIR="builds/$VERSION"
          CHUNK_DIR="chunks_tmp"
          mkdir -p "$BUILD_DIR"
          mkdir -p "$CHUNK_DIR"

          # Split APK into raw chunks
          CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d --numeric-suffixes=1 -a 3 "$APK_PATH" "$CHUNK_DIR/chunk."

          # Package each chunk as its own ZIP
          cd "$CHUNK_DIR"
          for f in chunk.*; do
            zip "../$BUILD_DIR/${f}.zip" "$f"
          done
          cd ..

          # Create metadata
          TOTAL_SIZE=$(stat -c%s "$APK_PATH")
          NUM_CHUNKS=$(ls "$BUILD_DIR"/*.zip 2>/dev/null | wc -l)
          cat > "$BUILD_DIR/info.json" << INFO
          {
            "version": "$VERSION",
            "apk_name": "$(basename "$APK_PATH")",
            "total_size": $TOTAL_SIZE,
            "total_chunks": $NUM_CHUNKS,
            "chunk_size_mb": $CHUNK_SIZE_MB,
            "download_urls": [
          INFO

          for i in $(seq 1 $NUM_CHUNKS); do
            PADDED=$(printf "%03d" $i)
            echo "    \"https://raw.githubusercontent.com/${{ github.repository }}/main/$BUILD_DIR/chunk.${PADDED}.zip\"," >> "$BUILD_DIR/info.json"
          done

          # Remove trailing comma from last URL
          sed -i '$ s/,$//' "$BUILD_DIR/info.json"
          echo '  ]' >> "$BUILD_DIR/info.json"
          echo '}' >> "$BUILD_DIR/info.json"

          rm -rf "$CHUNK_DIR"

      - name: Commit ZIP chunks
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds/
          git commit -m "🌙 LunarVeil v$VERSION – chunked ZIPs" || echo "No changes"
          git push