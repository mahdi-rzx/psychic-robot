name: Build & Release LunarVeil APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
      chunk_size_mb:
        description: 'Chunk size (MB)'
        default: '5'
        required: false
      clean_old_builds:
        description: 'Delete all previous APK builds before this one'
        type: boolean
        default: false
        required: false

env:
  VERSION: ${{ github.event.inputs.version_name }}
  CHUNK_SIZE_MB: ${{ github.event.inputs.chunk_size_mb || '5' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old builds (if enabled)
        if: ${{ github.event.inputs.clean_old_builds == 'true' }}
        run: |
          rm -rf builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds
          git diff --cached --quiet || git commit -m "🧹 Clean old builds" && git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Split APK into chunk.zip.001, chunk.zip.002, …
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          mkdir -p release_chunks
          CHUNK_SIZE=$(( CHUNK_SIZE_MB * 1024 * 1024 ))
          split -b $CHUNK_SIZE -d --numeric-suffixes=1 -a 3 "$APK_PATH" release_chunks/temp.
          a=1
          for f in release_chunks/temp.*; do
            mv "$f" "release_chunks/chunk.zip.$(printf '%03d' $a)"
            a=$((a+1))
          done
          TOTAL_SIZE=$(stat -c%s "$APK_PATH")
          NUM_CHUNKS=$((a-1))
          echo "{\"version\":\"$VERSION\",\"size\":$TOTAL_SIZE,\"chunks\":$NUM_CHUNKS,\"chunk_size_mb\":$CHUNK_SIZE_MB}" > release_chunks/meta.json

      - name: Store chunks in builds/<version>
        run: |
          mkdir -p builds/$VERSION
          cp -r release_chunks/* builds/$VERSION/

      - name: Commit APK chunks
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add builds/
          git commit -m "🌙 LunarVeil v$VERSION APK chunks" || echo "No changes"
          git push